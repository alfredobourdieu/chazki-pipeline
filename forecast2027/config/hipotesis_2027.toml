]

[growth2027]
# Ventas nuevas 2027 (sección 4b, método homologado, 14-oct).
metodo = "homologado"            # "homologado" | "promedio_historico"
umbral_tanque = 50000            # venta en el año de alta (USD)
tope_tanque = 250000
mantener_total_regional = false  # false: el factor suma o resta
factor_mercado = { AR = 1.15, CL = 0.90, CO = 1.10, MX = 1.20, PE = 0.80 }
forma_mensual = "escalonada"     # "escalonada" (mes m = m/78) | "historica"
# Mega deals excluidos del cálculo de altas: [país, cuenta, año de alta].
exclusiones = [["MX", "Fuller", 2025], ["AR", "360", 2026]]

[fx]
# Sección 7. Criterio (11-oct): no se traslada el 100% del IPC a tarifa; se descuenta
# un % por país sobre la venta a dic-27 con rampa mes/12 desde enero. Sólo erosión.
escenario = "base"
ajuste_dic27 = { AR = -0.05, CL = -0.01, CO = -0.02, MX = -0.02, PE = -0.01 }
# Escenario alto (dólar global fuerte) para sensibilidad.
ajuste_dic27_alto = { AR = -0.131, CL = -0.043, CO = -0.066, MX = -0.077, PE = -0.035 }

[reglas]
# Mínimos de crecimiento 2027 vs 2026 por país (Auditoría 2027, sección 1).
minimo_crecimiento = { AR = 0.20, CO = 0.50, MX = 0.20, PE = 0.50, total = 0.15 }
# Cuenta "en rampa" si el real ene–sep es ≤ 35% de su total 2026.
rampa_umbral_real = 0.35
# Alerta de concentración.
top10_share_max = 0.60
