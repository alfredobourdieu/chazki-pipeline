# HIPÓTESIS DEL FORECAST 2027 — versión en código de la pestaña 'Hipótesis 2027'
# (bloques A–N, decisiones del 9 al 17-oct-2026). Cada cambio acá es un commit:
# queda quién, cuándo y por qué. El motor NO toma supuestos de ningún otro lado.
#
# Convenciones: países AR CL CO MX PE · meses 1..12 · clave de cuenta "PAIS|Cliente"
# (si el cliente se repite con otra vertical: "PAIS|Cliente|Vertical").

version = "2026-10-17"
snapshot = "2026-10-18"
objetivo_total_2027 = 45507484   # resultado del manual auditado el 17-oct (control de reproducción)

[base]
# 'Base 2026 real' = real cerrado (Braulio) hasta el mes cerrado + proyección oct–dic del 36M.
meses_cerrados = 9
# Mes base del enero 2027 por país (bloque K, 14-oct: AR pasó de octubre a septiembre).
mes_base = { AR = 9, CL = 11, CO = 10, MX = 12, PE = 11 }
# Ponderar por probabilidad de cierre (hoy el manual NO lo hace: hallazgo #6 de la auditoría).
ponderar_probabilidad = false

[estacionalidad]
# Fuente única: config/curvas_2027.json (derivado con scripts/derivar_curvas.py).
# Curva propia sólo si es significativa (p<0,10) o por decisión (Adidas FM).
curvas = "curvas_2027.json"
cuentas_curva_propia = ["MX|Liverpool", "CO|Bimbo", "CL|Adidas FM", "MX|Unilever", "CO|Casa Luker", "AR|Nestlé"]
# Cuentas con curva país forzada aunque tengan historia (bloque C).
cuentas_curva_pais_forzada = ["PE|iMile SM +Trujillo", "CO|Alimentos La Polar"]

[crecimiento]
# Rampa del crecimiento asignado: 'lineal' (mes m = 1 + g·(m−1)/11) o 'compuesta'.
rampa = "lineal"

# % asignado = Dic-27 vs Ene-27 (Inputs manual 2027, sección 3, vigente 17-oct).
[crecimiento.asignado]
"AR|MELI FM" = 0.05
"AR|MELI LM" = 0.15
"MX|MELI LM MX" = 0.05
"MX|Fuller" = 0.0
"MX|Liverpool" = 0.05
"MX|Coppel LM" = 0.05
"CO|Bimbo" = 0.0
"CL|Fazil CL" = 0.05
"MX|Coppel LM Big Item" = 0.05
"CL|Falabella LM" = 0.0
"CL|Adidas FM" = 0.05
"MX|Unilever" = 0.05
"PE|iMile SM +Trujillo" = 0.10
"CL|Falabella MM" = 0.0
