# ---------------------------------------------------------------------------
# Overrides por cuenta (Inputs sección 5 + bloque M). Campos posibles:
#   enero_fijo  = valor de enero sin estacionalidad (tipo '1')
#   nivel       = nivel mensual → enero = nivel × índice de enero (tipo '0');
#                 "promedio2026" usa el promedio mensual de la base 2026
#   tipo_enero  = "12" (dic-26 desestacionalizado) | "9" (sep-26) | "ENE" (default: mes base del país)
#   feb_x       = multiplicador puntual de febrero que se arrastra (ajuste de precio)
#   perfil2026  = true → 2027 = perfil mensual 2026 × (1 + g)  (Walmart CL)
#   nota        = por qué
# ---------------------------------------------------------------------------
[overrides."AR|MELI FM"]
feb_x = 1.15
nota = "Ajuste de precio de contrato en feb-27 (decisión 14-oct). Inputs sec. 1 aún dice 'enero fijo $400K' pero el manual usa sep-26 × factor (hallazgo del motor)."

