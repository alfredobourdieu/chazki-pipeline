[piso]
# Bloque B (piso 2026): 2027 = perfil mensual 2026 × (1 + g) para cuentas cuya caída
# venía de una base de enero baja, no del cliente. Las demás caídas se aceptan
# (decrecimiento orgánico o churn): el motor las deja salir de la base.
cuentas = [
  "MX|Walmart", "PE|Central Brand", "AR|Prota", "PE|Lacteus", "AR|Photo Store", "AR|Algabo",
  "AR|Modatex", "PE|Sony PE", "PE|La Zapatera", "AR|Mutual Unilever", "AR|Cislatam", "AR|Diffupar",
