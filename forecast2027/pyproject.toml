[project]
name = "forecast2027"
version = "0.1.0"
description = "Motor del Forecast 2027 de Chazki: ingesta, modelo CS, Growth, FX, auditoría y backtest."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forecast2027 = "forecast2027.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
