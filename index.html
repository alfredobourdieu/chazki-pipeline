// RIESGOS & CALIDAD — CEO Critical View
// ══════════════════════════════════════════════════════════════════════════
function SecRiesgo({deals}){
  const today=new Date().toISOString().split("T")[0];
  const zombieCut=new Date(Date.now()-ZOMBIE_DAYS*86400000).toISOString().split("T")[0];
  const active=deals.filter(isActiveDeal);

  // 1. Concentration risk — top 5 deals as % of total pipe
  const pipeW=wFn(active);
  const top5=[...active].sort((a,b)=>((b.amount||0)*getProb(b))-((a.amount||0)*getProb(a))).slice(0,5);
  const top5W=top5.reduce((s,d)=>s+(d.amount||0)*getProb(d),0);
  const concPct=pipeW>0?Math.round(top5W/pipeW*100):0;

  // 2. Overdue (fecha vencida)
  const overdue=active.filter(d=>d.close_date&&d.close_date<today).sort((a,b)=>(b.amount||0)-(a.amount||0));

  // 3. Zombies (sin actividad >30d)
  const zombies=active.filter(d=>!d.last_activity||d.last_activity<zombieCut).sort((a,b)=>(b.amount||0)-(a.amount||0));

  // 4. Big deals at low prob
  const bigLowProb=active.filter(d=>(d.amount||0)>100000&&getProb(d)<=0.2).sort((a,b)=>(b.amount||0)-(a.amount||0));

  // 5. No close date
  const noDate=active.filter(d=>!d.close_date);

  // Risk score (0-100)
  const riskScore=Math.min(100,
    (overdue.length>10?30:overdue.length*3)+
    (zombies.length>15?25:zombies.length*1.5)+
    (concPct>60?20:concPct/3)+
    (bigLowProb.length*4)+
    (noDate.length*0.5)
  );
  const riskColor=riskScore>60?DS.red:riskScore>35?DS.amber:DS.emerald;
  const riskLabel=riskScore>60?"ALTO":riskScore>35?"MEDIO":"BAJO";

  function RiskCard({title,count,amount,color,items,detail}){
    const [open,setOpen]=useState(false);
    return(
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <Label color={color}>{title}</Label>
            <div style={{display:"flex",alignItems:"baseline",gap:8,marginTop:4}}>
              <BigNum value={count} color={color} size={36}/>
              {amount>0&&<span style={{fontSize:14,color:DS.text2,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(amount)} en riesgo</span>}
            </div>
          </div>
          {count>0&&<button onClick={()=>setOpen(!open)} style={{fontSize:9,color:DS.text3,background:"none",border:`1px solid ${DS.border}`,cursor:"pointer",padding:"3px 10px",borderRadius:6}}>
            {open?"Ocultar":"Ver todos"}
          </button>}
        </div>
        {detail}
        {open&&items&&items.map((d,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderTop:`1px solid ${DS.border}`,fontSize:11}}>
            <div>
              <span style={{marginRight:6}}>{FM[d.country]?.flag||"🌍"}</span>
              <span style={{color:DS.text1,fontFamily:"monospace"}}>{d.name}</span>
              {d.close_date&&<span style={{fontSize:9,color:DS.text3,marginLeft:8}}>{fmtD(d.close_date)}</span>}
            </div>
            <span style={{color,fontFamily:"monospace",fontWeight:700}}>{fmt((d.amount||0)*getProb(d))}</span>
          </div>
        ))}
      </Card>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:24}}>
      {/* Risk Score Header */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12}}>
        {[
          {label:"Score de Riesgo",  val:riskLabel, sub:`${Math.round(riskScore)}/100`, color:riskColor},
          {label:"Concentración Top 5",val:`${concPct}%`, sub:`${fmt(top5W)} de ${fmt(pipeW)}`, color:concPct>60?DS.red:concPct>40?DS.amber:DS.emerald},
          {label:"Deals sin fecha",  val:noDate.length, sub:"sin close date", color:noDate.length>20?DS.red:DS.amber},
          {label:"Pipeline total",   val:fmt(pipeW), sub:`${active.length} deals activos`, color:DS.accent},
        ].map((k,i)=>(
          <Card key={i}>
            <Label color={k.color}>{k.label}</Label>
            <BigNum value={k.val} color={k.color} size={28}/>
            <p style={{fontSize:10,color:DS.text3,marginTop:4}}>{k.sub}</p>
          </Card>
        ))}
      </div>

      {/* Top 5 deals concentration */}
      <Card>
        <Label color={concPct>60?DS.red:DS.text2}>Concentración de Pipeline — Top 5 Deals ({concPct}% del total)</Label>
        <p style={{fontSize:11,color:DS.text3,marginBottom:16}}>
          {concPct>60?"⚠️ Riesgo ALTO: más del 60% del pipeline ponderado en 5 deals. Si 2 caen, el año se complica."
          :"El pipeline tiene concentración moderada. Monitoreá estos deals de cerca."}
        </p>
        {top5.map((d,i)=>{
          const w=(d.amount||0)*getProb(d);
          const pct=pipeW>0?w/pipeW*100:0;
          const isOverdue=d.close_date&&d.close_date<today;
          const isZombie=!d.last_activity||d.last_activity<zombieCut;
          return(
            <div key={i} style={{marginBottom:14}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11,fontWeight:700,color:DS.text3,fontFamily:"monospace",minWidth:20}}>{i+1}</span>
                  <span>{FM[d.country]?.flag||"🌍"}</span>
                  <span style={{fontSize:12,color:DS.text1,fontFamily:"monospace"}}>{d.name}</span>
                  {isOverdue&&<PillBadge label="VENCIDO" color={DS.red}/>}
                  {isZombie&&<PillBadge label="ZOMBIE" color={DS.amber}/>}
                </div>
                <div style={{textAlign:"right"}}>
                  <span style={{fontSize:13,fontWeight:700,color:DS.accent,fontFamily:"monospace"}}>{fmt(w)}</span>
                  <span style={{fontSize:10,color:DS.text3,marginLeft:6}}>({Math.round(getProb(d)*100)}%)</span>
                </div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1}}>
                  <MiniBar pct={pct} color={DS.accent} height={6}/>
                </div>
                <span style={{fontSize:9,color:DS.text3,minWidth:35}}>{pct.toFixed(1)}%</span>
                <span style={{fontSize:9,color:DS.text3}}>{d.owner||"Sin asignar"}</span>
              </div>
            </div>
          );
        })}
      </Card>

      {/* Deal aging per stage */}
      {(()=>{
        const stageAging={};
        const today2=new Date().toISOString().split("T")[0];
        active.forEach(d=>{
          const sl=d.stage_label||"Sin etapa";
          if(!stageAging[sl])stageAging[sl]={totalDays:0,count:0,totalW:0};
          if(d.last_activity){
            const days=Math.round((new Date(today2)-new Date(d.last_activity))/86400000);
            stageAging[sl].totalDays+=days;
            stageAging[sl].count++;
            stageAging[sl].totalW+=(d.amount||0)*getProb(d);
          }
        });
        const stageRows=Object.entries(stageAging)
          .map(([stage,{totalDays,count,totalW}])=>({stage,avgDays:count>0?Math.round(totalDays/count):0,count,totalW}))
          .sort((a,b)=>b.avgDays-a.avgDays);
        const maxDays=Math.max(...stageRows.map(r=>r.avgDays),1);
        return(
          <Card>
            <Label color={DS.text2}>Deal Aging por Etapa — Días promedio sin actividad</Label>
            <p style={{fontSize:10,color:DS.text3,margin:"2px 0 12px"}}>Deals activos · última actividad registrada. +{ZOMBIE_DAYS}d = zombie risk</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {stageRows.slice(0,8).map((r,i)=>{
                const pct=(r.avgDays/maxDays)*100;
                const color=r.avgDays>ZOMBIE_DAYS?DS.red:r.avgDays>14?DS.amber:DS.emerald;
                return(
                  <div key={i}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:11,color:DS.text1,fontFamily:"monospace"}}>{r.stage}</span>
                        {r.avgDays>ZOMBIE_DAYS&&<PillBadge label="⚠️ zombie risk" color={DS.red}/>}
                      </div>
                      <div style={{display:"flex",gap:12,fontFamily:"monospace",fontSize:11}}>
                        <span style={{color:color,fontWeight:700}}>{r.avgDays}d avg</span>
                        <span style={{color:DS.text3}}>{r.count} deals</span>
                        <span style={{color:DS.cyan}}>{fmt(r.totalW)}</span>
                      </div>
                    </div>
                    <div style={{height:6,background:"rgba(0,0,0,0.06)",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:color,borderRadius:3}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })()}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        <RiskCard title="Fechas Vencidas" count={overdue.length} amount={overdue.reduce((s,d)=>s+(d.amount||0)*getProb(d),0)}
          color={DS.red} items={overdue.slice(0,8)}
          detail={<p style={{fontSize:11,color:DS.text3,marginBottom:8}}>Deals cuyo close date ya pasó. Actualizar o perder credibilidad del pipeline.</p>}/>
        <RiskCard title={`Zombies +${ZOMBIE_DAYS}d`} count={zombies.length} amount={zombies.reduce((s,d)=>s+(d.amount||0)*getProb(d),0)}
          color={DS.amber} items={zombies.slice(0,8)}
          detail={<p style={{fontSize:11,color:DS.text3,marginBottom:8}}>Sin actividad por más de {ZOMBIE_DAYS} días. Necesitan acción inmediata.</p>}/>
      </div>

      {/* Deal Aging by Stage — Sprint 2 */}
      <Card>
        <Label color={DS.text2}>Antigüedad por Etapa — Promedio de días sin actividad</Label>
        <p style={{fontSize:11,color:DS.text3,marginBottom:14}}>
          Las etapas con más días sin actividad indican cuellos de botella. {">"} 21 días = riesgo de abandono.
        </p>
        {(()=>{
          const stageGroups={};
          active.forEach(d=>{
            const sl=d.stage_label||"Sin etapa";
            if(!stageGroups[sl])stageGroups[sl]={deals:0,totalDays:0,pipeW:0,maxDays:0};
            const lastAct=d.last_activity||d.created||today;
            const days=Math.max(0,Math.round((new Date(today)-new Date(lastAct))/86400000));
            stageGroups[sl].deals++;
            stageGroups[sl].totalDays+=days;
            stageGroups[sl].pipeW+=(d.amount||0)*getProb(d);
            stageGroups[sl].maxDays=Math.max(stageGroups[sl].maxDays,days);
          });
          const stages=Object.entries(stageGroups)
            .map(([s,v])=>({stage:s,...v,avgDays:Math.round(v.totalDays/v.deals)}))
            .filter(s=>s.deals>0)
            .sort((a,b)=>b.avgDays-a.avgDays);
          const maxAvg=Math.max(...stages.map(s=>s.avgDays),1);
          return(
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {stages.map((s,i)=>{
                const pct=(s.avgDays/maxAvg)*100;
                const c=s.avgDays>30?DS.red:s.avgDays>21?DS.amber:s.avgDays>14?DS.text2:DS.emerald;
                return(
                  <div key={i}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:11,color:DS.text1,fontFamily:"monospace",minWidth:220}}>{s.stage}</span>
                        <span style={{fontSize:9,color:DS.text3,fontFamily:"monospace"}}>{s.deals} deals · {fmt(s.pipeW)}</span>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        {s.avgDays>21&&<PillBadge label={s.avgDays>30?"CRÍTICO":"ATENCIÓN"} color={c}/>}
                        <span style={{fontSize:13,fontWeight:700,color:c,fontFamily:"monospace",minWidth:50,textAlign:"right"}}>{s.avgDays}d</span>
                      </div>
                    </div>
                    <div style={{height:7,background:"rgba(0,0,0,0.06)",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${pct}%`,background:c,borderRadius:4}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </Card>

      {/* Big deals low prob */}
      {bigLowProb.length>0&&(
        <Card>
          <Label color={DS.red}>Deals Grandes con Probabilidad Baja ({">"} $100K y ≤ 20%)</Label>
          <p style={{fontSize:11,color:DS.text3,marginBottom:12}}>Estos deals inflan el pipeline pero difícilmente cierren. Revisar validez o remover.</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
            {bigLowProb.slice(0,6).map((d,i)=>(
              <div key={i} style={{borderRadius:8,padding:"10px 12px",background:`${DS.red}08`,border:`1px solid ${DS.red}20`}}>
                <div style={{fontSize:10,color:DS.text3,marginBottom:4}}>{FM[d.country]?.flag} {d.owner||"—"}</div>
                <div style={{fontSize:11,color:DS.text1,fontFamily:"monospace",marginBottom:4}}>{d.name.slice(0,35)}</div>
                <div style={{display:"flex",justifyContent:"space-between"}}>
                  <span style={{fontSize:12,fontWeight:700,color:DS.red,fontFamily:"monospace"}}>{fmt(d.amount)}</span>
                  <span style={{fontSize:10,color:DS.red}}>@{Math.round(getProb(d)*100)}%</span>
                </div>
                {d.close_date&&<div style={{fontSize:9,color:DS.text3,marginTop:2}}>{fmtD(d.close_date)}</div>}
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Scenario modeling */}
      <Card highlight>
        <Label color={DS.accent}>Modelo de Escenarios — ¿Cuánto podemos cerrar?</Label>
        <p style={{fontSize:11,color:DS.text3,marginBottom:16}}>Basado en el pipeline actual y probabilidades de HubSpot</p>
        {(()=>{
          const wonYtd=deals.filter(d=>isWonDeal(d)&&d.close_date>=YEAR_START).reduce((s,d)=>s+(d.amount||0),0);
          const scenarios=[
            {label:"Pesimista",desc:"Solo deals ≥70% cierran",pct:0.5,color:DS.red},
            {label:"Base",desc:"Pipeline ponderado actual",pct:1.0,color:DS.amber},
            {label:"Optimista",desc:"Pipeline ponderado ×1.5",pct:1.5,color:DS.emerald},
          ];
          return(
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
              {scenarios.map((sc,i)=>{
                const projected=wonYtd+(pipeW*sc.pct);
                const gap=FORECAST_TOTAL-projected;
                const pctOfTarget=projected/FORECAST_TOTAL*100;
                return(
                  <div key={i} style={{borderRadius:10,padding:16,border:`2px solid ${sc.color}30`,background:`${sc.color}06`}}>
                    <div style={{fontSize:12,fontWeight:700,color:sc.color,fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{sc.label}</div>
                    <div style={{fontSize:9,color:DS.text3,marginBottom:10}}>{sc.desc}</div>
                    <div style={{fontSize:24,fontWeight:700,color:sc.color,fontFamily:"'JetBrains Mono',monospace"}}>{fmt(projected)}</div>
                    <div style={{fontSize:10,color:DS.text3,marginTop:4}}>= {pctOfTarget.toFixed(0)}% del OKR</div>
                    <div style={{fontSize:10,color:gap>0?DS.red:DS.emerald,marginTop:2}}>{gap>0?`❌ Falta ${fmt(gap)}`:`✅ Supera por ${fmt(-gap)}`}</div>
                    <div style={{marginTop:10}}>
                      <MiniBar pct={Math.min(pctOfTarget,130)} color={sc.color} height={5}/>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}
      </Card>
    </div>
  );
}

// MAIN
// ══════════════════════════════════════════════════════════════════════════
function Dashboard(){
  const [deals,setDeals]=useState(null);
  const [loading,setLoading]=useState(false);
  const [status,setStatus]=useState("");
  const [error,setError]=useState(null);
  const [lastUpdated,setLastUpdated]=useState(null);
  const [tab,setTab]=useState("pulso");
  const [weekAgoSnap,setWeekAgoSnap]=useState(null);

  async function load(){
    setLoading(true);setError(null);
    try{
      const {deals:d}=await fetchDeals(setStatus);
      setDeals(d);setLastUpdated(new Date());
      const active=d.filter(isActiveDeal);
      const byC={};
      active.forEach(x=>{if(x.country)byC[x.country]=(byC[x.country]||0)+(x.amount||0)*getProb(x);});
      const w=wFn(active);
      const snap=await getWeekAgo();setWeekAgoSnap(snap);
      await saveSnap(byC,w);
    }catch(e){setError(e.message);}
    finally{setLoading(false);setStatus("");}
  }

  // Auto-load on mount
  useEffect(()=>{ load(); },[]);

  const dateStr=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});

  // Board KPIs — computed for header strip
  const boardKPIs = deals && !loading ? (()=>{
    const active = deals.filter(isActiveDeal);
    const pipeW  = wFn(active);
    const wonYtd = deals.filter(d=>isWonDeal(d)&&d.close_date>=YEAR_START).reduce((s,d)=>s+(d.amount||0),0);
    const covPct = Math.round((pipeW/TOTAL_TARGET)*100);
    const covCol = covPct>=100?DS.emerald:covPct>=70?DS.amber:DS.red;
    const wonCol = wonYtd>0?DS.emerald:DS.text3;
    const alerts = active.filter(d=>d.close_date&&d.close_date<new Date().toISOString().split("T")[0]).length;
    return {pipeW,wonYtd,covPct,covCol,wonCol,alerts,activeDeals:active.length};
  })() : null;

  return(
    <div style={{display:"flex",minHeight:"100vh",background:DS.bg,fontFamily:"'Barlow','Inter',sans-serif"}}>

      {/* ── SIDEBAR ─────────────────────────────────────────────── */}
      <aside style={{
        width:220,flexShrink:0,background:DS.sidebar,
        display:"flex",flexDirection:"column",
        borderRight:`1px solid ${DS.sidebarBorder}`,
        position:"sticky",top:0,height:"100vh",overflow:"hidden",
      }}>
        {/* Logo */}
        <div style={{padding:"28px 24px 20px",borderBottom:`1px solid ${DS.sidebarBorder}`}}>
          <div style={{fontSize:20,fontWeight:800,color:"#ffffff",letterSpacing:"-0.01em",fontFamily:"'Barlow Condensed','Arial Narrow',sans-serif",textTransform:"uppercase"}}>CHAZKI</div>
          <div style={{fontSize:9,color:DS.sidebarText,letterSpacing:"0.18em",textTransform:"uppercase",marginTop:2,fontWeight:600}}>PIPELINE INTEL 2026</div>
        </div>

        {/* Nav */}
        <nav style={{flex:1,overflowY:"auto",padding:"16px 0"}}>
          {TABS.map((t,i)=>{
            const active=tab===t.id;
            return(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{
                display:"flex",alignItems:"flex-start",gap:14,
                width:"100%",padding:"12px 24px",cursor:"pointer",
                background:active?DS.sidebarActiveBg:"transparent",
                border:"none",textAlign:"left",
                borderLeft:`3px solid ${active?DS.sidebarAccent:"transparent"}`,
                transition:"all 0.15s",
              }}>
                <span style={{fontSize:11,fontWeight:700,color:active?DS.sidebarAccent:DS.sidebarText,fontFamily:"'JetBrains Mono',monospace",marginTop:1,minWidth:18}}>{String(i+1).padStart(2,"0")}</span>
                <div>
                  <div style={{fontSize:12,fontWeight:active?700:500,color:active?DS.sidebarActive:DS.sidebarText,fontFamily:"'Barlow Condensed','Arial Narrow',sans-serif",textTransform:"uppercase",letterSpacing:"0.06em",lineHeight:1.3}}>{t.label}</div>
                  <div style={{fontSize:9,color:active?"rgba(255,255,255,0.35)":DS.sidebarText,marginTop:1,opacity:0.7}}>{t.subtitle}</div>
                </div>
              </button>
            );
          })}
        </nav>

        {/* Footer */}
        <div style={{padding:"16px 24px",borderTop:`1px solid ${DS.sidebarBorder}`}}>
          <div style={{fontSize:9,color:DS.sidebarText,marginBottom:8}}>🇦🇷 🇨🇱 🇨🇴 🇲🇽 🇵🇪</div>
          <button onClick={load} disabled={loading} style={{
            width:"100%",padding:"8px",fontSize:9,fontWeight:700,
            letterSpacing:"0.12em",textTransform:"uppercase",borderRadius:7,
            cursor:loading?"not-allowed":"pointer",border:"none",
            background:loading?"rgba(0,0,0,0.07)":DS.sidebarAccent,
            color:loading?DS.sidebarText:"#fff",
          }}>
            {loading?status||"···":"↻ Actualizar"}
          </button>
          {lastUpdated&&<div style={{fontSize:8,color:DS.sidebarText,marginTop:6,textAlign:"center"}}>↻ {lastUpdated.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}</div>}
        </div>
      </aside>

      {/* ── MAIN CONTENT ───────────────────────────────────────── */}
      <main style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"auto"}}>

        {/* Content header */}
        <div style={{background:"#ffffff",borderBottom:`1px solid ${DS.border}`,padding:"20px 32px",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:24}}>
            <div>
              {/* Section number + title */}
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:28,fontWeight:800,color:DS.accent,fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>
                  {String(TABS.findIndex(t=>t.id===tab)+1).padStart(2,"0")}
                </span>
                <div>
                  <h1 style={{fontSize:20,fontWeight:700,color:DS.text1,margin:0,fontFamily:"'Barlow Condensed','Arial Narrow',sans-serif",textTransform:"uppercase",letterSpacing:"0.04em"}}>
                    {TABS.find(t=>t.id===tab)?.label}
                  </h1>
                  <p style={{fontSize:11,color:DS.text3,margin:"2px 0 0",fontFamily:"'Barlow',sans-serif"}}>
                    {tab==="pulso"?"Consolidado Chazki · Adquisición 2026 · "+dateStr:TABS.find(t=>t.id===tab)?.subtitle}
                  </p>
                </div>
              </div>
            </div>

            {/* Board KPIs top-right */}
            {boardKPIs&&(
              <div style={{display:"flex",gap:28,alignItems:"flex-start",flexShrink:0}}>
                {[
                  {label:"Pipeline Pond.",   value:fmt(boardKPIs.pipeW),   color:DS.accent},
                  {label:"Won YTD 2026",     value:fmt(boardKPIs.wonYtd),  color:boardKPIs.wonCol},
                  {label:"Cobertura Budget",    value:`${boardKPIs.covPct}%`, color:boardKPIs.covCol},
                  {label:"Deals activos",    value:boardKPIs.activeDeals,  color:DS.text2},
                ].map((k,i)=>(
                  <div key={i} style={{textAlign:"right"}}>
                    <div style={{fontSize:20,fontWeight:700,color:k.color,fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{k.value}</div>
                    <div style={{fontSize:9,color:DS.text3,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:"'Barlow Condensed',sans-serif",marginTop:3}}>{k.label}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>

        {/* Content body */}
        <div style={{flex:1,padding:"28px 32px"}}>

          {!deals&&!loading&&!error&&(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",gap:24}}>
              <div style={{textAlign:"center",maxWidth:400}}>
                <div style={{fontSize:48,marginBottom:16}}>📊</div>
                <h2 style={{fontSize:22,fontWeight:700,color:DS.text1,margin:"0 0 8px",fontFamily:"'Barlow Condensed',sans-serif",textTransform:"uppercase",letterSpacing:"0.04em"}}>Chazki Pipeline Intelligence</h2>
                <p style={{fontSize:13,color:DS.text3,marginBottom:28,lineHeight:1.6}}>Cargando pipeline desde HubSpot...</p>
                <button onClick={load} style={{padding:"12px 32px",fontSize:11,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",borderRadius:8,cursor:"pointer",border:"none",background:DS.accent,color:"#fff",boxShadow:`0 4px 20px ${DS.accentGlow}`}}>
                  Conectar HubSpot →
                </button>
              </div>
            </div>
          )}

          {loading&&(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"60vh",gap:16}}>
              <div style={{width:48,height:48,borderRadius:12,background:DS.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>⚡</div>
              <p style={{fontSize:13,color:DS.text2}}>{status||"Conectando con HubSpot..."}</p>
              <div style={{display:"flex",gap:5}}>
                {[0,1,2,3].map(i=><div key={i} style={{width:7,height:7,borderRadius:"50%",background:DS.accent,opacity:0.3+(i*0.2),animation:`bounce 0.8s ${i*0.12}s infinite`}}/>)}
              </div>
            </div>
          )}

          {error&&(
            <div style={{borderRadius:10,padding:18,background:"#fef2f2",border:"1px solid #fecaca",marginBottom:16}}>
              <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                <span style={{fontSize:18}}>⚠️</span>
                <div>
                  <p style={{color:DS.red,fontSize:13,wordBreak:"break-all",margin:"0 0 8px"}}>{error}</p>
                  <button onClick={load} style={{fontSize:11,color:DS.text2,background:"none",border:`1px solid ${DS.border}`,cursor:"pointer",padding:"4px 12px",borderRadius:6}}>Reintentar</button>
                </div>
              </div>
            </div>
          )}

          {deals&&!loading&&(
            <div>
              {tab==="pulso"       &&<><SectionHeader icon="📡" title="Pulso Ejecutivo"             subtitle="Situación actual · KPIs críticos · alertas · cierre Marzo" accent={DS.accent}/><SecPulso deals={deals}/></>}
              {tab==="modelo"      &&<><SectionHeader icon="🎯" title="Modelo & Proyección 2026"    subtitle="Pipeline ponderado · cobertura del OKR · tendencias acumuladas" accent={DS.accent}/><SecModelo deals={deals}/></>}
              {tab==="riesgo"      &&<><SectionHeader icon="⚠️" title="Riesgos & Calidad del Pipeline" subtitle="Concentración · zombies · fechas vencidas · escenarios" accent={DS.red}/><SecRiesgo deals={deals}/></>}
              {tab==="evolucion"   &&<><SectionHeader icon="📈" title="Evolución Week over Week"    subtitle="Variación semanal de pipeline ponderado por país" accent={DS.cyan}/><SecEvolucion deals={deals} weekAgoSnap={weekAgoSnap}/></>}
              {tab==="funnel"      &&<><SectionHeader icon="📊" title="Funnel de Adquisición"       subtitle="Embudo ponderado · tasas de conversión · filtros" accent={DS.cyan}/><SecFunnel deals={deals}/></>}
              {tab==="equipo"      &&<><SectionHeader icon="🏆" title="Equipo & Rankings"           subtitle="Performance · quota gap · productividad · YTD y Marzo" accent="#f97316"/><SecRankings deals={deals}/></>}
              {tab==="deals"       &&<><SectionHeader icon="💼" title="Gestión de Deals"            subtitle="Top deals · movimientos · ganados · alertas activas" accent={DS.amber}/><SecDeals deals={deals}/></>}
            </div>
          )}
        </div>

        {/* Footer */}
        <div style={{padding:"12px 32px",borderTop:`1px solid ${DS.border}`,background:"#ffffff",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:9,color:DS.text3,textTransform:"uppercase",letterSpacing:"0.15em",fontFamily:"'Barlow Condensed',sans-serif",fontWeight:600}}>Chazki · VP Growth · Adquisición 2026</span>
          <div style={{display:"flex",alignItems:"center",gap:20}}>
            <span style={{fontSize:9,color:DS.text3}}>Budget Growth 26 · {fmt(FORECAST_TOTAL)}</span>
            <span style={{fontSize:9,color:DS.text3}}>Budget 36M · {fmt(TOTAL_TARGET)}</span>
          </div>
        </div>
      </main>
    </div>
  );
}

</script>
</body>
</html>
