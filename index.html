// ── PROBABILITY — exact match to HubSpot screenshot ──────────────────────
// HubSpot Pipeline 137007495 = Adquisición Última Milla
// HubSpot Pipeline 95256391  = Adquisición Media & Primera Milla
// Screenshot shows: Contrato/100%, Negociación M&P/90%, PropEnv M&P/50%, PropAcept/50%, PropEnv UltMilla/30%
//
// CRITICAL: HubSpot API returns hs_deal_stage_probability as 0-1 float OR as 0-100 integer.
// We normalize both. If API value is present and valid, we always use it.
// If not, we fall back to exact probabilities from HubSpot config screenshot.

function normProb(raw) {
  if (raw == null || raw === "") return null;
  const n = parseFloat(raw);
  if (isNaN(n) || n < 0) return null;
  // HubSpot sometimes sends 30.0 meaning 30% → normalize to 0.30
  // But also sends 0.3 meaning 30% → keep as-is
  // Values > 1.0 must be percentages
  if (n > 1.0) return Math.min(n / 100, 1.0);
  return n;
}
function getProb(deal) {
  const sl = (deal.stage_label || "").toLowerCase();
  // Active pipeline stages → 100% (regardless of is_won flag)
  const isActivePipeline = sl.includes("contrato") || sl.includes("setup") || sl.includes("piloto") || sl.includes("operando") || sl.includes("onboarding") || sl.includes("integración") || sl.includes("integracion") || sl.includes("estabiliz");
  if (isActivePipeline) return 1.0;
  // Won or lost
  if (deal.is_won) return 1.0;
  if (deal.is_lost) return 0.0;

  // Try hs_deal_stage_probability first (0-1 or 0-100 float)
  const p1 = normProb(deal.probability);
  if (p1 != null && p1 >= 0) return p1;

  // Try hs_forecast_amount / amount ratio (gives effective probability)
  if (deal.forecast_amount != null && deal.amount > 0) {
    const pForecast = deal.forecast_amount / deal.amount;
    if (pForecast >= 0 && pForecast <= 1) return pForecast;
  }

  // Try hs_predicted_amount / amount ratio
  if (deal.predicted_amount != null && deal.amount > 0) {
    const pPred = deal.predicted_amount / deal.amount;
    if (pPred >= 0 && pPred <= 1) return pPred;
  }

  // Priority 2: fallback — exact match to HubSpot stage config screenshot
  const pid = deal.pipeline_id || "";

  // Última Milla (137007495)
  if (pid === "137007495") {
    if (sl.includes("etapa de contrato")) return 1.0; // 100%
    if (sl.includes("negoci")) return 0.9; // 90% (not in screenshot but logical)
    if (sl.includes("propuesta aceptada")) return 0.5; // 50%
    if (sl.includes("propuesta enviada") || sl.includes("propuesta")) return 0.3; // 30%
    if (sl.includes("demo") || sl.includes("reuni")) return 0.2;
    if (sl.includes("calific")) return 0.1;
    return 0.05;
  }

  // Media & Primera Milla (95256391)
  if (pid === "95256391") {
    if (sl.includes("contrato") || sl.includes("setup") || sl.includes("firma")) return 0.5; // 50%
    if (sl.includes("negoci")) return 0.9; // 90%
    if (sl.includes("propuesta aceptada")) return 0.5; // 50%
    if (sl.includes("propuesta enviada") || sl.includes("propuesta")) return 0.5; // 50%
    if (sl.includes("demo") || sl.includes("reuni")) return 0.2;
    if (sl.includes("calific")) return 0.1;
    return 0.05;
  }

  // Unknown pipeline — use stage label only
  if (sl.includes("contrato")) return 0.75;
  if (sl.includes("negoci")) return 0.9;
  if (sl.includes("propuesta aceptada")) return 0.5;
  if (sl.includes("propuesta")) return 0.35;
  if (sl.includes("demo") || sl.includes("reuni")) return 0.2;
  if (sl.includes("calific")) return 0.1;
  return 0.1;
}

// ── Deal classification — single source of truth ──────────────────────────
// Rules:
//   is_lost = true  → always lost
//   is_won  = true  → won (historical contracts from updater also get is_won=true)
//   else            → active pipeline
//
// getProb() returns 1.0 for active contrato/piloto/operando stage labels
// updater.gs ensures historical deals (closeDate < 2025) have is_won=true

function isLostDeal(d) {
  return d.is_lost || ["closedlost", "perdido", "lost", "detenido", "frío", "frio"].some(k => (d.stage_label || "").toLowerCase().includes(k));
}
function isWonDeal(d) {
  return !!d.is_won;
}
function isActiveDeal(d) {
  return !isLostDeal(d) && !isWonDeal(d);
}
// En Operación = active deals with contrato/piloto/operando stage (for display purposes)
function isContracted(d) {
  if (!isActiveDeal(d)) return false;

  return sl.includes("contrato") || sl.includes("setup") || sl.includes("integración") || sl.includes("integracion");
}
function isPilotoDeal(d) {
  if (!isActiveDeal(d)) return false;

  return sl.includes("piloto") || sl.includes("operando") || sl.includes("estabiliz");
}

// ── API fetch ──────────────────────────────────────────────────────────────
async function fetchDeals(setStatus) {
  setStatus("Cargando datos del pipeline...");
  const cacheBust = Math.floor(Date.now() / 60000);
  let res;
  try {
    res = await fetch('./data.json?v=' + cacheBust);
  } catch (e) {
    throw new Error("No se pudo conectar. Verificá tu conexión.");
  }
  if (!res.ok) throw new Error("No se encontró data.json (HTTP " + res.status + "). El updater.gs aún no corrió.");
  setStatus("Procesando...");
  const data = await res.json();
  const raw = Array.isArray(data) ? data : data.deals || [];
  if (!raw.length) throw new Error("data.json está vacío — el updater.gs aún no corrió.");

  // If data.json has embedded prev_week snapshot, inject into localStorage
  if (data.prev_week && data.prev_week.byC) {
    try {
      const snaps = JSON.parse(localStorage.getItem('chazki_v8_snaps') || '[]');
      const weekAgo = Date.now() - 7 * 86400000;
      const alreadyHas = snaps.some(s => Math.abs(s.ts - weekAgo) < 3 * 86400000);
      if (!alreadyHas) {
        snaps.push({
          ts: weekAgo,
          byC: data.prev_week.byC,
          w: data.prev_week.w
        });
        localStorage.setItem('chazki_v8_snaps', JSON.stringify(snaps.slice(-60)));
      }
    } catch (e) {}
  }
  const deals = raw.map(d => ({
    ...d,
    probability: d.probability ?? d.prob ?? null
  }));
  return {
    deals
  };
}
