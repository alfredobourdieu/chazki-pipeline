// ── PROBABILITY — exact match to HubSpot screenshot ──────────────────────
// HubSpot Pipeline 137007495 = Adquisición Última Milla
// HubSpot Pipeline 95256391  = Adquisición Media & Primera Milla
// Screenshot shows: Contrato/100%, Negociación M&P/90%, PropEnv M&P/50%, PropAcept/50%, PropEnv UltMilla/30%
//
// CRITICAL: HubSpot API returns hs_deal_stage_probability as 0-1 float OR as 0-100 integer.
// We normalize both. If API value is present and valid, we always use it.
// If not, we fall back to exact probabilities from HubSpot config screenshot.

function normProb(raw) {
  if (raw == null || raw === "") return null;
  const n = parseFloat(raw);
  if (isNaN(n) || n < 0) return null;
  // HubSpot sometimes sends 30.0 meaning 30% → normalize to 0.30
  // But also sends 0.3 meaning 30% → keep as-is
  // Values > 1.0 must be percentages
  if (n > 1.0) return Math.min(n / 100, 1.0);
  return n;
}

function getProb(deal) {
  const sl = (deal.stage_label || "").toLowerCase();
  const won  = deal.is_won  || sl.includes("closedwon")  || sl.includes("ganado");
  const lost = deal.is_lost || sl.includes("closedlost") || sl.includes("perdido");
  if (won)  return 1.0;
  if (lost) return 0.0;

  // Try hs_deal_stage_probability first (0-1 or 0-100 float)
  const p1 = normProb(deal.probability);
  if (p1 != null && p1 >= 0) return p1;

  // Try hs_forecast_amount / amount ratio (gives effective probability)
  if (deal.forecast_amount != null && deal.amount > 0) {
    const pForecast = deal.forecast_amount / deal.amount;
    if (pForecast >= 0 && pForecast <= 1) return pForecast;
  }

  // Try hs_predicted_amount / amount ratio
  if (deal.predicted_amount != null && deal.amount > 0) {
    const pPred = deal.predicted_amount / deal.amount;
    if (pPred >= 0 && pPred <= 1) return pPred;
  }

  // Priority 2: fallback — exact match to HubSpot stage config screenshot
  const pid = deal.pipeline_id || "";

  // Última Milla (137007495)
  if (pid === "137007495") {
    if (sl.includes("etapa de contrato"))           return 1.0;  // 100%
    if (sl.includes("negoci"))                      return 0.9;  // 90% (not in screenshot but logical)
    if (sl.includes("propuesta aceptada"))          return 0.5;  // 50%
    if (sl.includes("propuesta enviada") ||
        sl.includes("propuesta"))                   return 0.3;  // 30%
    if (sl.includes("demo") || sl.includes("reuni"))return 0.2;
    if (sl.includes("calific"))                     return 0.1;
    return 0.05;
  }

  // Media & Primera Milla (95256391)
  if (pid === "95256391") {
    if (sl.includes("contrato") || sl.includes("setup") || sl.includes("firma")) return 0.5; // 50%
    if (sl.includes("negoci"))                      return 0.9;  // 90%
    if (sl.includes("propuesta aceptada"))          return 0.5;  // 50%
    if (sl.includes("propuesta enviada") ||
        sl.includes("propuesta"))                   return 0.5;  // 50%
    if (sl.includes("demo") || sl.includes("reuni"))return 0.2;
    if (sl.includes("calific"))                     return 0.1;
    return 0.05;
  }

  // Unknown pipeline — use stage label only
  if (sl.includes("contrato"))                      return 0.75;
  if (sl.includes("negoci"))                        return 0.9;
  if (sl.includes("propuesta aceptada"))            return 0.5;
  if (sl.includes("propuesta"))                     return 0.35;
  if (sl.includes("demo") || sl.includes("reuni"))  return 0.2;
  if (sl.includes("calific"))                       return 0.1;
  return 0.1;
}

function isWonDeal(d) {
  const sl = (d.stage_label||"").toLowerCase();
  return d.is_won || sl.includes("closedwon") || sl.includes("ganado") || sl.includes("won");
}
function isLostDeal(d) {
  const sl = (d.stage_label||"").toLowerCase();
  return d.is_lost || sl.includes("closedlost") || sl.includes("perdido") || sl.includes("lost");
}
function isContracted(d){ return (d.stage_label||"").toLowerCase().includes("etapa de contrato"); }
function isActiveDeal(d) { return !isLostDeal(d) && (!isWonDeal(d) || isContracted(d)); }
// For won deals, close_date may be null in HubSpot (not set by exec).
// Fall back to last_activity date so we can still bucket the deal into the right month.
function wonDate(d) {
  // ONLY use close_date — never last_activity (avoids 2025 deals leaking into 2026 filters)
  return d.close_date || null; //ay still be null — callers must guard
}

const mEnd   = m  => new Date(new Date().getFullYear(),m+1,0).toISOString().split("T")[0];
const wFn    = arr => arr.reduce((s,d)=>s+(d.amount||0)*getProb(d),0);

function cumulTarget(model) {
  const now=new Date(), m=now.getMonth(), dom=now.getDate(), dim=new Date(now.getFullYear(),m+1,0).getDate();
  let c=0; for(let i=0;i<m;i++) c+=model.months[i]; return c+model.months[m]*(dom/dim);
}

const SNAP_KEY="chazki_v8_snaps";
async function loadSnaps(){try{const r=localStorage.getItem(SNAP_KEY);return r?JSON.parse(r):[]}catch{return[]}}
async function saveSnap(byC,w){try{const s=await loadSnaps();s.push({ts:Date.now(),byC,w});localStorage.setItem(SNAP_KEY,JSON.stringify(s.slice(-60)))}catch{}}
async function getWeekAgo(){try{const s=await loadSnaps();if(!s.length)return null;const t=Date.now()-7*86400000;const b=[...s].sort((a,b)=>Math.abs(a.ts-t)-Math.abs(b.ts-t))[0];return Math.abs(b.ts-t)<10*86400000?b:null}catch{return null}}

// ── API fetch ──────────────────────────────────────────────────────────────
async function fetchDeals(setStatus) {
  setStatus("Cargando datos del pipeline...");
  const cacheBust = Math.floor(Date.now() / 60000);
  let res;
  try {
    res = await fetch('./data.json?v=' + cacheBust);
  } catch(e) {
    throw new Error("No se pudo conectar. Verificá tu conexión.");
  }
  if (!res.ok) throw new Error("No se encontró data.json (HTTP " + res.status + "). El updater.gs aún no corrió.");
  setStatus("Procesando...");
  const data = await res.json();
  const raw = Array.isArray(data) ? data : (data.deals || []);
  if (!raw.length) throw new Error("data.json está vacío — el updater.gs aún no corrió.");
  
  // If data.json has embedded prev_week snapshot, inject into localStorage
  if (data.prev_week && data.prev_week.byC) {
    try {
      const snaps = JSON.parse(localStorage.getItem('chazki_v8_snaps') || '[]');
      const weekAgo = Date.now() - 7 * 86400000;
      const alreadyHas = snaps.some(s => Math.abs(s.ts - weekAgo) < 3 * 86400000);
      if (!alreadyHas) {
        snaps.push({ ts: weekAgo, byC: data.prev_week.byC, w: data.prev_week.w });
        localStorage.setItem('chazki_v8_snaps', JSON.stringify(snaps.slice(-60)));
      }
    } catch(e) {}
  }

  const deals = raw.map(d => ({
    ...d,
    probability: d.probability ?? d.prob ?? null,
  }));
  return { deals };
}

function SecPulso({deals}){
  const wkS=wk(), moS=mo(), pS=prevMoStart(), pE=prevMoEnd();
  const active=deals.filter(isActiveDeal);
  const pipeW=wFn(active);

  const wonPrev=deals.filter(d=>isWonDeal(d)&&wonDate(d)>=pS&&wonDate(d)<=pE);
  const newWk=deals.filter(d=>!isLostDeal(d)&&d.created&&d.created>=wkS);
  const movedWk=active.filter(d=>d.last_activity&&d.last_activity>=wkS);
  const today=new Date().toISOString().split("T")[0];

                    <DealBlock items={myWonFeb} icon="🏆" label="Won Marzo" color="#818cf8"/>
                    <DealBlock items={myNew} icon="🆕" label="Deals generados" color="#60a5fa"/>

                    <DealBlock items={myNegoc} icon="🤝" label="En negociación" color={DS.amber}/>

                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

function SecProductividad({deals}){
  const [view,setView]=useState("semana");
  const active=deals.filter(isActiveDeal);
  const wkS=wk();
  // "este mes" = PREV_MONTH (Marzo = último mes cerrado)
  const pmS=prevMoStart(), pmE=prevMoEnd();

  // Use all deals owners so won-only execs (no active pipeline) still appear
  const allOwners=[...new Set(deals.map(d=>d.owner).filter(Boolean))].sort();
  const rows=allOwners.map(o=>{
    const my=active.filter(d=>d.owner===o);
    const bk=k=>my.filter(d=>[].concat(k).some(kk=>(d.stage_label||"").toLowerCase().includes(kk))).length;
    const daysArr=my.filter(d=>d.days_in_stage>0).map(d=>d.days_in_stage);
    const avgDays=daysArr.length?Math.round(daysArr.reduce((a,b)=>a+b,0)/daysArr.length):null;
    return{
      owner:o, pipe:wFn(my), total:my.length,
      preventa:bk(["prosp","calific","demo","reuni"]),
      propuesta:bk(["propuesta"]), negoc:bk(["negoc"]),
      cierre:bk(["contrato","setup","firma","cierre"]), avgDays,
      // Weekly
      newWk:deals.filter(d=>!isLostDeal(d)&&d.owner===o&&d.created&&d.created>=wkS).length,
      movWk:my.filter(d=>d.last_activity&&d.last_activity>=wkS).length,
      wonWk:deals.filter(d=>isWonDeal(d)&&d.owner===o&&d.close_date>=wkS&&d.close_date>=YEAR_START).length,
      wonWkVal:deals.filter(d=>isWonDeal(d)&&d.owner===o&&d.close_date>=wkS&&d.close_date>=YEAR_START).reduce((s,d)=>s+(d.amount||0),0),
      // Prev month (Marzo)
      newPm:deals.filter(d=>!isLostDeal(d)&&d.owner===o&&d.created&&d.created>=pmS&&d.created<=pmE).length,
      movPm:my.filter(d=>d.last_activity&&d.last_activity>=pmS&&d.last_activity<=pmE).length,
      wonPm:deals.filter(d=>isWonDeal(d)&&d.owner===o&&wonDate(d)>=pmS&&wonDate(d)<=pmE).length,
      wonPmVal:deals.filter(d=>isWonDeal(d)&&d.owner===o&&wonDate(d)>=pmS&&wonDate(d)<=pmE).reduce((s,d)=>s+(d.amount||0),0),
      countries:[...new Set(my.map(d=>d.country).filter(Boolean))],
    };
  }).sort((a,b)=>b.pipe-a.pipe);

  if(!rows.length) return <p style={{color:DS.text3,textAlign:"center",padding:32,fontFamily:"monospace"}}>Sin datos</p>;

  const maxPipe=Math.max(...rows.map(r=>r.pipe),1);
  const maxDays=Math.max(...rows.map(r=>r.avgDays||0),1);

  const WCOLS=[
    {k:"pipe",   h:"Pipeline",     r:r=>fmt(r.pipe),    p:r=>r.pipe/maxPipe, good:true},
    {k:"prev",   h:"Preventa",     r:r=>r.preventa,     p:r=>r.preventa/Math.max(...rows.map(x=>x.preventa),1), good:true},
    {k:"prop",   h:"Propuesta",    r:r=>r.propuesta,    p:r=>r.propuesta/Math.max(...rows.map(x=>x.propuesta),1), good:true},
    {k:"neg",    h:"Negoc.",       r:r=>r.negoc,        p:r=>r.negoc/Math.max(...rows.map(x=>x.negoc),1), good:true},
    {k:"cier",   h:"Cierre",       r:r=>r.cierre,       p:r=>r.cierre/Math.max(...rows.map(x=>x.cierre),1), good:true},

function SecModelo({deals}){
  const active=deals.filter(isActiveDeal);
  const pipeW=wFn(active);
  const pipeByC={};
  active.forEach(d=>{if(d.country)pipeByC[d.country]=(pipeByC[d.country]||0)+(d.amount||0)*getProb(d);});

  // Three monthly series
  const curM=new Date().getMonth();
  const MLABELS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  // Modelo = FORECAST data (OFICIAL MODELO R37-R49) → $144K acum Mar
  // Forecast = FM data (Resumen 2026 36M)             → $137K acum Mar
  const modelByM=Array(12).fill(0);
  const forecastByM=Array(12).fill(0);
  Object.values(FORECAST).forEach(m=>m.months.forEach((v,i)=>{modelByM[i]+=v;}));
  Object.values(FM).forEach(m=>m.months.forEach((v,i)=>{forecastByM[i]+=v;}));

  // Won real by month (HubSpot close_date, excl. future dates)
  // Jan: $685K | Feb: $161K | Mar: $212K
  const wonByM=Array(12).fill(0);
  const todayM=new Date().getMonth();
  deals.filter(d=>isWonDeal(d)).forEach(d=>{
    if(!d.close_date||d.close_date<YEAR_START) return;
    const m=new Date(d.close_date+'T12:00:00Z').getMonth();
    if(m>todayM) return; // skip future-dated won deals
    wonByM[m]+=(d.amount||0);
  });
  const totalModelYtd    = modelByM.slice(0,curM+1).reduce((s,v)=>s+v,0);
  const totalForecastYtd = forecastByM.slice(0,curM+1).reduce((s,v)=>s+v,0);
  const totalWonYtd      = wonByM.slice(0,curM+1).reduce((s,v)=>s+v,0); // only through current month
  // Modelo uses FORECAST_TOTAL annual, Forecast uses TOTAL_TARGET annual
  const modelAnnual      = FORECAST_TOTAL;   // $3,547,357
  const forecastAnnual   = TOTAL_TARGET;     // $3,607,620
  const covPct           = Math.min(Math.round((pipeW/forecastAnnual)*100),999); // Budget = FM $3.60M
  const covColor         = covPct>=80?DS.emerald:covPct>=50?DS.amber:DS.red; // Budget coverage color
  const pipeVsModel      = pipeW - modelAnnual;

  const modelVsForecast  = modelAnnual - forecastAnnual;
  const wonVsModel       = totalWonYtd - totalModelYtd;

              {label:"Modelo Financiero 2026",  val:fmt(FORECAST_TOTAL),color:"#f97316",  sub:`Gap vs Budget: ${fmt(Math.abs(TOTAL_TARGET-FORECAST_TOTAL))}`},
              {label:"Won YTD (cierre real)",   val:fmt(wonYtd2),      color:DS.emerald,  sub:`vs Modelo Q1 (${fmt(totalModelYtd)}): ${Math.round(wonYtd2/Math.max(totalModelYtd,1)*100)}%`},
            ].map((k,i)=>(
              <Card key={i} accent>
                <Label color={k.color}>{k.label}</Label>
                <BigNum value={k.val} color={k.color} size={20}/>
                <p style={{fontSize:10,color:DS.text3,marginTop:4,fontFamily:"monospace"}}>{k.sub}</p>
              </Card>
            ))}
          </div>
        );
      })()}

      {/* ② Gap analysis — 3 comparaciones clave */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
        {[
          {label:"Pipeline vs Budget",val:`${covPct}%`,sub:`${pipeVsModel>=0?"▲ excede":"▼ falta"} ${fmt(Math.abs(pipeVsModel))}`,color:covColor,bg:`${covColor}12`,border:`${covColor}30`},
          {label:"Pipeline vs Budget",val:fmt(pipeW),sub:`${pipeVsForecast>=0?"▲ +":"▼ "}${fmt(Math.abs(pipeVsForecast))} vs Budget`,color:pipeVsForecast>=0?DS.emerald:DS.red,bg:"transparent",border:DS.border},

              {yTicks.map((t,i)=>(<g key={i}><line x1={PAD.l} y1={t.y} x2={W-PAD.r} y2={t.y} stroke="rgba(0,0,0,0.07)" strokeWidth="1"/><text x={PAD.l-5} y={t.y+4} textAnchor="end" fontSize="9" fill="#64748b" fontFamily="monospace">{fmt(t.v)}</text></g>))}
              {MLBLS.map((l,i)=>(<text key={i} x={px(i)} y={H-4} textAnchor="middle" fontSize="9" fill={i<n?"#64748b":"#94a3b8"} fontFamily="monospace">{l}</text>))}
              <line x1={px(n-1)} y1={PAD.t} x2={px(n-1)} y2={PAD.t+plotH} stroke="rgba(0,0,0,0.12)" strokeWidth="1" strokeDasharray="4 3"/>
              <text x={px(n-1)+4} y={PAD.t+10} fontSize="8" fill="#94a3b8">hoy</text>
              <path d={sp(ptsMdl)} fill="none" stroke="#6366f133" strokeWidth="1.5" strokeDasharray="5 4"/>
              <path d={sp(ptsFM)} fill="none" stroke="#f9731633" strokeWidth="1.5" strokeDasharray="5 4"/>
              <path d={`${sp(ptsMdl.slice(0,n))} L ${px(n-1)} ${PAD.t+plotH} L ${PAD.l} ${PAD.t+plotH} Z`} fill="rgba(99,102,241,0.07)" stroke="none"/>
              <path d={`${sp(ptsFM.slice(0,n))} L ${px(n-1)} ${PAD.t+plotH} L ${PAD.l} ${PAD.t+plotH} Z`} fill="rgba(249,115,22,0.05)" stroke="none"/>
              <path d={sp(ptsMdl.slice(0,n))} fill="none" stroke="#6366f1" strokeWidth="2.5" strokeLinecap="round"/>
              <path d={sp(ptsFM.slice(0,n))} fill="none" stroke="#f97316" strokeWidth="2.5" strokeLinecap="round"/>
              {cumWon[n-1]>0&&<path d={sp(ptsWon.slice(0,n))} fill="none" stroke="#10b981" strokeWidth="1.5" strokeLinecap="round" strokeDasharray="5 3"/>}
              <circle cx={ptsMdl[n-1][0]} cy={ptsMdl[n-1][1]} r="5" fill="#6366f1" stroke="white" strokeWidth="2"/>
              <text x={ptsMdl[n-1][0]+8} y={ptsMdl[n-1][1]-3} fontSize="10" fill="#6366f1" fontFamily="monospace" fontWeight="700">{fmt(cumMdl[n-1])}</text>
              <text x={ptsMdl[n-1][0]+8} y={ptsMdl[n-1][1]+9} fontSize="8" fill="#64748b" fontFamily="monospace">Modelo Fin.</text>
              <circle cx={ptsFM[n-1][0]} cy={ptsFM[n-1][1]} r="5" fill="#f97316" stroke="white" strokeWidth="2"/>
              <text x={ptsFM[n-1][0]+8} y={ptsFM[n-1][1]-3} fontSize="10" fill="#f97316" fontFamily="monospace" fontWeight="700">{fmt(cumFM[n-1])}</text>
              <text x={ptsFM[n-1][0]+8} y={ptsFM[n-1][1]+9} fontSize="8" fill="#64748b" fontFamily="monospace">CS Growth</text>
              {cumWon[n-1]>0&&<><circle cx={ptsWon[n-1][0]} cy={ptsWon[n-1][1]} r="4" fill="#10b981" stroke="white" strokeWidth="1.5"/>
              <text x={ptsWon[n-1][0]-8} y={ptsWon[n-1][1]-7} fontSize="9" fill="#10b981" fontFamily="monospace" fontWeight="700" textAnchor="end">{fmt(cumWon[n-1])}</text>
              <text x={ptsWon[n-1][0]-8} y={ptsWon[n-1][1]+5} fontSize="8" fill="#64748b" fontFamily="monospace" textAnchor="end">Won Real</text></>}
              <circle cx={ptsMdl[11][0]} cy={ptsMdl[11][1]} r="3" fill="#6366f133" stroke="#6366f1" strokeWidth="1.5"/>
              <text x={ptsMdl[11][0]+5} y={ptsMdl[11][1]+4} fontSize="8" fill="#6366f166" fontFamily="monospace">{fmt(FORECAST_TOTAL)}</text>
              <circle cx={ptsFM[11][0]} cy={ptsFM[11][1]} r="3" fill="#f9731633" stroke="#f97316" strokeWidth="1.5"/>
              <text x={ptsFM[11][0]+5} y={ptsFM[11][1]+12} fontSize="8" fill="#f9731666" fontFamily="monospace">{fmt(TOTAL_TARGET)}</text>
            </svg>
          );
        })()}
        <div style={{display:"flex",gap:16,marginTop:10,paddingTop:10,borderTop:`1px solid ${DS.border}`,flexWrap:"wrap"}}>
          {[["#6366f1","Modelo Financiero (top-down $3.54M)"],["#f97316","Budget CS Growth (bottom-up $3.60M)"],["#10b981","Won Real HubSpot (esc. secundaria)"],["#6366f133","── Proyección anual"]].map(([bg,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:5}}>
              <div style={{width:12,height:4,borderRadius:2,background:bg}}/>
              <span style={{fontSize:9,color:DS.text3,fontFamily:"monospace"}}>{l}</span>
            </div>
          ))}
        </div>
      </Card>

      {/* Per-country mini charts */}
      <Card>
        <Label color={DS.text2}>Tendencias por país — acumulado Modelo vs Forecast vs Pipeline</Label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:12}}>
          {Object.entries(FM).map(([ctry,m])=>{
            // Modelo = FORECAST[ctry] months, Forecast = FM months (m.months)
            const modelMonths=FORECAST[ctry]?.months||[];
            const modelAnnual2=FORECAST[ctry]?.annual||0;
            const forecastAnnual2=m.annual; // FM annual
            const pipe=pipeByC[ctry]||0;
            const W2=270, H2=120, P2={t:12,r:6,b:20,l:42};
            const pw2=W2-P2.l-P2.r, ph2=H2-P2.t-P2.b;
            const cumCM=[], cumCF=[];
            let scm=0, scf=0;
            for(let i=0;i<12;i++){scm+=modelMonths[i]||0;scf+=m.months[i]||0;cumCM.push(scm);cumCF.push(scf);}
            const scw=0; // Won removed from chart
            // Scale to annual end so dashed projections fit within chart
            const maxV2=Math.max(cumCM[11]||0, cumCF[11]||0, 1);
            const px2=i=>P2.l+(i/11)*pw2;
            const py2=v=>P2.t+ph2-(v/maxV2)*ph2;
            function sp2(pts){
              if(!pts||pts.length<1)return'';
              if(pts.length===1)return`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
              let d=`M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
              for(let i=1;i<pts.length;i++){const p=pts[i-1],c=pts[i],cx=(p[0]+c[0])/2;d+=` C ${cx.toFixed(1)},${p[1].toFixed(1)} ${cx.toFixed(1)},${c[1].toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`;}
              return d;
            }
            const ptsCM=cumCM.map((_,i)=>[px2(i),py2(cumCM[i])]);
            const ptsCF=cumCF.map((_,i)=>[px2(i),py2(cumCF[i])]);
            const pipeY=py2(pipe);
            const covPct2=Math.min(Math.round((pipe/modelAnnual2)*100),999);
            const cc2=covPct2>=80?DS.emerald:covPct2>=50?DS.amber:DS.red;

            const MLBLS2=["E","F","M","A","M","J","J","A","S","O","N","D"];
            return(
              <div key={ctry} style={{padding:10,borderRadius:12,border:`1px solid ${DS.border}`,background:"rgba(0,0,0,0.02)"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:13,fontWeight:700,color:DS.text1,fontFamily:"monospace"}}>{m.flag} {ctry}</span>
                  <div style={{textAlign:"right"}}>
                    <span style={{fontSize:11,color:DS.cyan,fontWeight:700,fontFamily:"monospace"}}>{fmt(pipe)}</span>
                    <span style={{fontSize:9,color:cc2,fontFamily:"monospace",marginLeft:5}}>cob. {covPct2}%</span>
                  </div>
                </div>
                <svg viewBox={`0 0 ${W2} ${H2}`} width="100%" style={{overflow:"visible"}}>
                  {[0,0.5,1].map((t,ti)=>(
                    <g key={ti}>
                      <line x1={P2.l} y1={py2(maxV2*t)} x2={W2-P2.r} y2={py2(maxV2*t)} stroke="rgba(0,0,0,0.05)" strokeWidth="1"/>
                      <text x={P2.l-3} y={py2(maxV2*t)+4} textAnchor="end" fontSize="7.5" fill="#334155" fontFamily="monospace">{fmt(maxV2*t)}</text>
                    </g>
                  ))}
                  {MLBLS2.map((l,i)=>(
                    <text key={i} x={px2(i)} y={H2-3} textAnchor="middle" fontSize="7" fill={i<=curM?"#475569":"#1e293b"} fontFamily="monospace">{l}</text>
                  ))}
                  {/* Pipeline horizontal reference */}
                  <line x1={P2.l} y1={pipeY} x2={W2-P2.r} y2={pipeY} stroke={DS.cyan} strokeWidth="1.2" strokeDasharray="3 3" opacity="0.6"/>
                  {/* Full year dashed */}
                  <path d={sp2(ptsCM)} fill="none" stroke="rgba(99,102,241,0.3)" strokeWidth="1" strokeDasharray="4 3"/>
                  <path d={sp2(ptsCF)} fill="none" stroke="rgba(167,139,250,0.3)" strokeWidth="1" strokeDasharray="4 3"/>
                  {/* YTD solid */}
                  <path d={sp2(ptsCM.slice(0,curM+1))} fill="none" stroke="rgba(99,102,241,0.85)" strokeWidth="2" strokeLinecap="round"/>
                  <path d={sp2(ptsCF.slice(0,curM+1))} fill="none" stroke="rgba(167,139,250,0.8)" strokeWidth="1.5" strokeLinecap="round" strokeDasharray="5 3"/>
                  {ptsCM[curM]&&<circle cx={ptsCM[curM][0]} cy={ptsCM[curM][1]} r="3" fill="rgba(99,102,241,0.9)" stroke="white" strokeWidth="1.5"/>}
                </svg>
                <div style={{display:"flex",gap:10,marginTop:4}}>
                  {[["rgba(99,102,241,0.85)",`Mod. ${fmt(modelAnnual2)}`],["rgba(167,139,250,0.8)",`Fcast ${fmt(forecastAnnual2)}`]].map(([bg,l])=>(
                    <div key={l} style={{display:"flex",alignItems:"center",gap:3}}>
                      <div style={{width:10,height:3,borderRadius:2,background:bg}}/>
                      <span style={{fontSize:8,color:DS.text3,fontFamily:"monospace"}}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </Card>



    </div>
  );
}

// EVOLUCIÓN WoW / MoM
// ══════════════════════════════════════════════════════════════════════════
function SecEvolucion({deals,weekAgoSnap}){
  const [period,setPeriod]=useState("wow"); // "wow" | "mom" | "mtd"

  const active=deals.filter(isActiveDeal);
  const byC={};
  active.forEach(d=>{if(d.country)byC[d.country]=(byC[d.country]||0)+(d.amount||0)*getProb(d);});
  const totalNow=wFn(active);

  // Pipeline comparison (WoW uses snapshots, MoM uses date ranges on current data)
  const totalBefore_wow=weekAgoSnap?.w??null;

  // For WoW: use snapshot if available, else show current with note
  // For MoM: compare deal counts/values created this month vs prev month
  const totalBefore=period==="wow"?totalBefore_wow:null;
  const hasWowData=totalBefore_wow!=null;

  const totalDelta=totalBefore!=null?totalNow-totalBefore:null;
  const totalPct=totalBefore!=null&&totalBefore>0?((totalNow-totalBefore)/totalBefore)*100:null;

  // ── Date helpers ─────────────────────────────────────────────
  const today=new Date().toISOString().split("T")[0];
  const wkS=wk();
  const lastWkS=new Date(Date.now()-14*86400000).toISOString().split("T")[0];
  const lastWkE=new Date(Date.now()-7*86400000).toISOString().split("T")[0];
  const moS=mo();
  const pS=prevMoStart(), pE=prevMoEnd();

  const [curS,curE,prevS,prevE,periodLabel,periodLabelPrev]=period==="wow"
    ?[wkS,today,lastWkS,lastWkE,"Esta semana","Semana pasada"]
    :period==="mtd"
    ?[moS,today,pS,pE,"MTD (Abril)","Marzo completo"]
    :[moS,today,pS,pE,"Este mes (Abril)",PREV_MONTH_LABEL];

  // ── Exec stats calculator ─────────────────────────────────────
  function execStats(owner,start,end){
    const mine=deals.filter(d=>d.owner===owner);
    const wonD=mine.filter(d=>isWonDeal(d)&&d.close_date&&d.close_date>=start&&d.close_date<=end);
    const genD=mine.filter(d=>!isLostDeal(d)&&d.created&&d.created>=start&&d.created<=end);
    const propD=mine.filter(d=>!isLostDeal(d)&&d.last_activity&&d.last_activity>=start&&d.last_activity<=end&&(d.stage_label||"").toLowerCase().includes("propuesta"));
    return{
      won:wonD.length, wonVal:wonD.reduce((s,d)=>s+(d.amount||0),0),
      generated:genD.length,
      proposals:propD.length,
    };
  }

  const owners=[...new Set(deals.map(d=>d.owner).filter(Boolean))].sort();

  const execRows=owners.map(o=>({
    owner:o,
    cur:execStats(o,curS,curE),
    prev:execStats(o,prevS,prevE),
    pipe:wFn(active.filter(d=>d.owner===o)),
    countries:[...new Set(deals.filter(d=>d.owner===o&&!isLostDeal(d)).map(d=>d.country).filter(Boolean))],
  })).filter(r=>r.cur.generated>0||r.cur.won>0||r.cur.proposals>0||r.prev.generated>0||r.prev.won>0||r.prev.proposals>0||r.pipe>0)
    .sort((a,b)=>b.pipe-a.pipe);

  function DeltaBadge({cur,prev,isCurrency=false}){
    const delta=cur-prev;
    const pct=prev>0?((delta/prev)*100):null;
    const color=delta>0?DS.emerald:delta<0?DS.red:DS.text3;
    const arrow=delta>0?"▲":delta<0?"▼":"—";
    return(
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:18,fontWeight:900,color:DS.text1,fontFamily:"monospace",lineHeight:1}}>{isCurrency?fmt(cur):cur}</div>
        <div style={{fontSize:10,color,fontFamily:"monospace",marginTop:3,fontWeight:700}}>
          {delta!==0?`${arrow} ${isCurrency?fmt(Math.abs(delta)):Math.abs(delta)}`:delta===0&&prev>0?"= sin cambio":"—"}
        </div>
        {pct!=null&&delta!==0&&<div style={{fontSize:9,color,fontFamily:"monospace"}}>{pct>=0?"+":""}{pct.toFixed(0)}%</div>}
        <div style={{fontSize:8,color:DS.text3,fontFamily:"monospace",marginTop:2}}>{isCurrency?fmt(prev):prev} ant.</div>
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:20}}>

      {/* ── Period selector ── */}
      <div style={{display:"flex",gap:8}}>
        {[["wow","📅 Semana (WoW)"],["mtd","📅 MTD vs Mes Ant."],["mom",`📅 Mes completo (MoM)`]].map(([v,l])=>(
          <button key={v} onClick={()=>setPeriod(v)}
            style={{padding:"7px 16px",fontSize:10,fontFamily:"monospace",borderRadius:8,cursor:"pointer",
              background:period===v?"rgba(0,210,255,0.2)":"rgba(0,0,0,0.05)",
              color:period===v?DS.cyan:DS.text3,
              border:`1px solid ${period===v?"rgba(0,210,255,0.4)":DS.border}`,fontWeight:period===v?700:400}}>
            {l}
          </button>
        ))}
      </div>

      {/* ══ SECCIÓN 1: PIPELINE POR PAÍS ══ */}
      {period==="wow"&&!hasWowData&&(
        <div style={{padding:"10px 14px",borderRadius:8,background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.2)",marginBottom:12}}>
          <span style={{fontSize:11,color:DS.amber,fontWeight:600}}>ℹ️ Sin snapshot histórico — hacé clic en "Actualizar" por 2 semanas seguidas para habilitar comparación WoW real.</span>
        </div>
      )}
      <div>
        <Label color={DS.text2}>PIPELINE PONDERADO — {period==="wow"?"WoW (vs hace 7 días)":"MoM (vs "+PREV_MONTH_LABEL+")"}</Label>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginTop:12}}>
          {[
            {label:"Pipeline Hoy",val:fmt(totalNow),color:DS.cyan},
            {label:period==="wow"?"Hace 7 días":PREV_MONTH_LABEL,val:totalBefore!=null?fmt(totalBefore):"—",color:DS.text2},
            {label:"Δ "+periodLabel,val:totalDelta!=null?`${totalDelta>=0?"▲":"▼"} ${fmt(Math.abs(totalDelta))}`:"—",
              sub:totalPct!=null?`${totalPct>=0?"+":""}${totalPct.toFixed(1)}%`:period==="mom"?"acumulando MoM":"acumulando historial",
              color:totalDelta==null?DS.text3:totalDelta>=0?DS.emerald:DS.red},
          ].map((k,i)=>(
            <Card key={i} accent>
              <Label color={k.color}>{k.label}</Label>
              <BigNum value={k.val} color={k.color} size={20}/>
              {k.sub&&<p style={{fontSize:10,color:k.color,marginTop:4,fontFamily:"monospace"}}>{k.sub}</p>}
            </Card>
          ))}
        </div>
        <Card className="" style={{marginTop:12}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${DS.border}`}}>
                {["País","Pipeline Hoy",period==="wow"?"-7 días":PREV_MONTH_LABEL,"Δ Valor","Δ %","Tendencia"].map(h=>(
                  <th key={h} style={{fontSize:9,color:DS.text3,textTransform:"uppercase",letterSpacing:"0.08em",padding:"0 12px 12px",fontFamily:"monospace",fontWeight:600,textAlign:h==="País"?"left":"right",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {Object.entries(FM).map(([c,m])=>{
                const now=byC[c]||0;
                const prev=period==="wow"?(weekAgoSnap?.byC?.[c]??null):null;
                const delta=prev!=null?now-prev:null, pct=prev!=null&&prev>0?((now-prev)/prev)*100:null;
                const maxVal=Math.max(now,prev||0,1);
                const dc=delta==null?DS.text3:delta>=0?DS.emerald:DS.red;
                return(
                  <tr key={c} style={{borderBottom:`1px solid ${DS.border}`}}>
                    <td style={{padding:"12px 12px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>{m.flag}</span><span style={{fontSize:13,fontWeight:700,color:DS.text1,fontFamily:"monospace"}}>{c}</span></div></td>
                    <td style={{textAlign:"right",padding:"12px 12px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:DS.cyan}}>{fmt(now)}</td>
                    <td style={{textAlign:"right",padding:"12px 12px",fontFamily:"monospace",fontSize:13,color:DS.text3}}>{prev!=null?fmt(prev):"—"}</td>
                    <td style={{textAlign:"right",padding:"12px 12px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:dc}}>{delta!=null?`${delta>=0?"▲":"▼"} ${fmt(Math.abs(delta))}`:"—"}</td>
                    <td style={{textAlign:"right",padding:"12px 12px",fontFamily:"monospace",fontSize:11,fontWeight:700,color:dc}}>{pct!=null?`${pct>=0?"+":""}${pct.toFixed(1)}%`:"—"}</td>
                    <td style={{padding:"12px 12px",width:120}}>
                      <div style={{display:"flex",flexDirection:"column",gap:4}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:8,color:DS.text3,width:20}}>hoy</span><div style={{flex:1,height:6,background:DS.border,borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,background:m.color,width:`${(now/maxVal)*100}%`,transition:"width 0.7s"}}/></div></div>
                        {prev!=null&&<div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:8,color:DS.text3,width:20}}>ant.</span><div style={{flex:1,height:4,background:DS.border,borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",borderRadius:4,opacity:0.35,background:m.color,width:`${(prev/maxVal)*100}%`}}/></div></div>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {!weekAgoSnap&&period==="wow"&&<p style={{fontSize:10,color:DS.text3,textAlign:"center",marginTop:16,fontFamily:"monospace"}}>Pipeline WoW aparece luego de 7 días de snapshots automáticos</p>}
        </Card>
      </div>

      {/* ══ SECCIÓN 2: RESUMEN CONSOLIDADO ══ */}
      <Card>
        <Label color={DS.text2}>RESUMEN CONSOLIDADO — {periodLabel.toUpperCase()}</Label>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginTop:14}}>
          {(()=>{
            const totCur={gen:0,prop:0,won:0,wonVal:0};
            const totPrev={gen:0,prop:0,won:0,wonVal:0};
            execRows.forEach(r=>{
              totCur.gen+=r.cur.generated; totCur.prop+=r.cur.proposals;
              totCur.won+=r.cur.won; totCur.wonVal+=r.cur.wonVal;
              totPrev.gen+=r.prev.generated; totPrev.prop+=r.prev.proposals;
              totPrev.won+=r.prev.won; totPrev.wonVal+=r.prev.wonVal;
            });
            return[
              {icon:"🆕",label:"Negocios generados",cur:totCur.gen,prev:totPrev.gen,color:"#60a5fa"},
              {icon:"📋",label:"Propuestas enviadas",cur:totCur.prop,prev:totPrev.prop,color:"#a78bfa"},
              {icon:"🏆",label:"Deals won",cur:totCur.won,prev:totPrev.won,color:DS.emerald},
              {icon:"💰",label:"Valor won",cur:totCur.wonVal,prev:totPrev.wonVal,color:DS.amber,isCurrency:true},
            ].map((k,i)=>{
              const delta=k.cur-k.prev;
              const dc=delta>0?DS.emerald:delta<0?DS.red:DS.text3;
              return(
                <div key={i} style={{textAlign:"center",padding:14,borderRadius:12,background:"rgba(0,0,0,0.02)",border:`1px solid ${DS.border}`}}>
                  <div style={{fontSize:22,marginBottom:6}}>{k.icon}</div>
                  <Label color={k.color}>{k.label}</Label>
                  <div style={{fontSize:22,fontWeight:900,color:DS.text1,fontFamily:"monospace",margin:"6px 0 2px"}}>{k.isCurrency?fmt(k.cur):k.cur}</div>
                  <div style={{fontSize:11,color:dc,fontFamily:"monospace",fontWeight:700}}>
                    {delta!==0?`${delta>0?"▲":"▼"} ${k.isCurrency?fmt(Math.abs(delta)):Math.abs(delta)}`:"-"}
                  </div>
                  <div style={{fontSize:9,color:DS.text3,fontFamily:"monospace",marginTop:2}}>
                    {k.isCurrency?fmt(k.prev):k.prev} en {periodLabelPrev.toLowerCase()}
                  </div>
                </div>
              );
            });
          })()}
        </div>
      </Card>

      {/* ══ SECCIÓN 3: GESTIÓN POR EJECUTIVO ══ */}
      <div>
        <div style={{marginBottom:16}}>

function SecFunnel({deals}){
  const [oF,setO]=useState(""), [cF,setC]=useState("");
  const active=deals.filter(isActiveDeal);
  // Normalize for comparison: trim + lowercase key
  const norm=s=>(s||"").toLowerCase().trim();
  // Owners from ALL deals
  const owners=[...new Set(deals.map(d=>d.owner).filter(Boolean))].sort();
  // Countries: from active deals + known FM countries that appear in deals
  const rawCountries=[...new Set(deals.map(d=>d.country).filter(Boolean))];
  const countries=[...new Set([
    ...rawCountries,
    ...Object.keys(FM).filter(c=>deals.some(d=>norm(d.country)===norm(c)))
  ])].filter(Boolean).sort();
  // Robust filter: normalize both sides for comparison
  const filtered=active.filter(d=>{
    const ownerMatch=!oF || norm(d.owner)===norm(oF);
    const countryMatch=!cF || norm(d.country)===norm(cF);
    return ownerMatch&&countryMatch;
  });

  // Sprint 2: BUCKETS mapped to real HubSpot stage labels from data.json
  // Real stages: Preventa/Exploración(17) · Preventa M&P(11) · Propuesta Enviada(48) ·
  //   Propuesta Enviada M&P(14) · Negociación Avanzada(16) · Negociación M&P(5) ·
  //   Negociación Avanzada M&P(4) · Propuesta Aceptada(8) · Calificación(4) ·
  //   Contrato/Setup M&P(3) · Etapa de Contrato(3) · Inicio Piloto(2)
  const BUCKETS=[
    {key:"preventa",   label:"Preventa / Exploración",keys:["preventa","explorac","calific","prosp"],color:"#64748b"},
    {key:"propuesta",  label:"Propuesta Enviada",     keys:["propuesta enviada"],                   color:"#3b82f6"},
    {key:"negavanz",   label:"Negociación Avanzada",  keys:["negociación avanzada","negociacion avanzada","avanzad"],color:"#f59e0b"},
    {key:"negoc",      label:"Negociación",           keys:["negociación m&p","negociacion m","negoc"],color:"#f97316"},
    {key:"propaceptada",label:"Propuesta Aceptada",   keys:["aceptada"],                            color:"#8b5cf6"},
    {key:"contrato",   label:"Contrato / Setup",      keys:["contrato","setup","etapa de contrato"],color:"#6d28d9"},
    {key:"piloto",     label:"Inicio Piloto",         keys:["piloto","inicio piloto"],              color:"#34a853"},
  ];

  const bData=BUCKETS.map(b=>{
    const bd=filtered.filter(d=>b.keys.some(k=>(d.stage_label||"").toLowerCase().includes(k)));
    return{...b,count:bd.length,value:bd.reduce((s,d)=>s+(d.amount||0),0),weighted:wFn(bd)};
  }).filter(b=>b.count>0);

  const maxW=Math.max(...bData.map(b=>b.weighted),1);
  const totalW=wFn(filtered), totalB=filtered.reduce((s,d)=>s+(d.amount||0),0);

  const byOwner={}, byCountry={};
  filtered.forEach(d=>{
    const o=d.owner||"Sin asignar"; if(!byOwner[o])byOwner[o]={count:0,w:0}; byOwner[o].count++;byOwner[o].w+=(d.amount||0)*getProb(d);
    const c=d.country||"Sin país"; if(!byCountry[c])byCountry[c]={count:0,w:0}; byCountry[c].count++;byCountry[c].w+=(d.amount||0)*getProb(d);
  });
  // Stage velocity — avg days since last_activity per bucket
  const today2=new Date().toISOString().split("T")[0];
  const bucketVelocity={};
  bData.forEach(b=>{
    const bd=filtered.filter(d=>b.keys.some(k=>(d.stage_label||"").toLowerCase().includes(k)));
    if(!bd.length){bucketVelocity[b.key]=null;return;}
    const avg=bd.reduce((s,d)=>{
      const la=d.last_activity||d.created||today2;
      return s+Math.max(0,Math.round((new Date(today2)-new Date(la))/86400000));
    },0)/bd.length;
    bucketVelocity[b.key]=Math.round(avg);
  });
  const maxO=Math.max(...Object.values(byOwner).map(v=>v.w),1);
  const maxCtry=Math.max(...Object.values(byCountry).map(v=>v.w),1);


  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* Filters — button group (más confiable que select en artifacts) */}
      <div style={{display:"flex",flexDirection:"column",gap:10,padding:14,borderRadius:12,background:"rgba(0,0,0,0.02)",border:`1px solid ${DS.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace",width:72,flexShrink:0}}>👤 Ejecutivo</span>
          {[""].concat(owners).map(o=>(
            <button key={o||"__all"} onClick={()=>setO(o)}
              style={{padding:"4px 10px",fontSize:10,fontFamily:"monospace",borderRadius:20,cursor:"pointer",
                background:oF===o?"rgba(99,102,241,0.3)":"rgba(0,0,0,0.05)",
                color:oF===o?"#a5b4fc":DS.text3,
                border:`1px solid ${oF===o?"rgba(99,102,241,0.5)":DS.border}`,
                whiteSpace:"nowrap"}}>
              {o||"Todos"}
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace",width:72,flexShrink:0}}>🌎 País</span>
          {[""].concat(countries).map(c=>(
            <button key={c||"__all"} onClick={()=>setC(c)}
              style={{padding:"4px 10px",fontSize:10,fontFamily:"monospace",borderRadius:20,cursor:"pointer",
                background:cF===c?"rgba(16,185,129,0.25)":"rgba(0,0,0,0.05)",
                color:cF===c?DS.emerald:DS.text3,
                border:`1px solid ${cF===c?"rgba(16,185,129,0.4)":DS.border}`,
                whiteSpace:"nowrap"}}>
              {c?(FM[c]?.flag||"🌐")+" "+c:"Todos"}
            </button>
          ))}
        </div>
      </div>

      {/* Totals */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
        <Card><Label>Deals activos</Label><BigNum value={filtered.length} size={22}/></Card>
        <Card><Label color={DS.text3}>Pipeline Bruto</Label><BigNum value={fmt(totalB)} color={DS.text2} size={22}/></Card>
        <Card accent><Label color={DS.cyan}>Pipeline Ponderado</Label><BigNum value={fmt(totalW)} color={DS.cyan} size={22}/></Card>
      </div>

      {/* Funnel bars */}
      <Card>
        <Label color={DS.text2}>Embudo por etapa — pipeline ponderado con tasa de conversión</Label>
        <div style={{display:"flex",flexDirection:"column",gap:12,marginTop:16}}>
          {bData.map((b,i)=>{
            const pct=(b.weighted/maxW)*100;
            const convPct=i>0&&bData[i-1].weighted>0?((b.weighted/bData[i-1].weighted)*100):null;
            return(
              <div key={b.key}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6,flexWrap:"wrap",gap:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:12,fontWeight:700,color:DS.text1,fontFamily:"monospace"}}>{b.label}</span>
                    <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{b.count} deals</span>
                    {convPct!=null&&<span style={{fontSize:9,fontFamily:"monospace",padding:"2px 6px",borderRadius:12,background:"rgba(0,0,0,0.07)",color:DS.text3}}>↓{convPct.toFixed(0)}%</span>}
                  </div>
                  <div style={{display:"flex",gap:12,fontFamily:"monospace",fontSize:11,alignItems:"center"}}>
                    {bucketVelocity[b.key]!=null&&(
                      <span style={{fontSize:9,padding:"1px 6px",borderRadius:10,
                        background:bucketVelocity[b.key]>ZOMBIE_DAYS?`${DS.red}15`:bucketVelocity[b.key]>14?`${DS.amber}15`:`${DS.emerald}12`,
                        color:bucketVelocity[b.key]>ZOMBIE_DAYS?DS.red:bucketVelocity[b.key]>14?DS.amber:DS.emerald,
                        fontWeight:700}}>⏱ {bucketVelocity[b.key]}d avg</span>
                    )}
                    <span style={{color:DS.text3}}>{fmt(b.value)}</span>
                    <span style={{color:DS.cyan,fontWeight:700}}>{fmt(b.weighted)}</span>
                  </div>
                </div>
                <div style={{height:28,background:"rgba(0,0,0,0.05)",borderRadius:8,overflow:"hidden",position:"relative"}}>
                  <div style={{position:"absolute",top:0,left:0,height:"100%",borderRadius:8,transition:"width 0.7s",display:"flex",alignItems:"center",paddingLeft:10,minWidth:4,width:`${Math.max(pct,2)}%`,background:`linear-gradient(90deg,${b.color}88,${b.color})`}}>
                    {pct>12&&<span style={{fontSize:10,color:"white",fontFamily:"monospace",fontWeight:700,whiteSpace:"nowrap"}}>{Math.round(pct)}%</span>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      {/* By owner + country */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {[{title:"👤 Por ejecutivo",data:byOwner,max:maxO,colorFn:()=>"linear-gradient(90deg,#7c3aed,#a78bfa)"},
          {title:"🌎 Por país",data:byCountry,max:maxCtry,colorFn:(k)=>FM[k]?.color||"#64748b"}].map(({title,data,max,colorFn})=>(
          <Card key={title}>
            <Label color={DS.text2}>{title} — ponderado</Label>
            <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:12}}>
              {Object.entries(data).sort((a,b)=>b[1].w-a[1].w).map(([k,{count,w}],i)=>(
                <div key={i}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11,fontFamily:"monospace"}}>
                    <span style={{color:DS.text1,fontWeight:600}}>{FM[k]?.flag||""} {k}</span>
                    <div style={{display:"flex",gap:12}}><span style={{color:DS.text3}}>{count}</span><span style={{color:DS.cyan,fontWeight:700}}>{fmt(w)}</span></div>
                  </div>
                  <MiniBar pct={(w/max)*100} color={colorFn(k)} height={6}/>
                </div>
              ))}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

function FunnelByCountry({deals}){
  const active=deals.filter(isActiveDeal);
  const byC={};
  active.forEach(d=>{
    const c=d.country||"Sin país"; if(!byC[c])byC[c]={count:0,w:0,bruto:0,stages:{}};
    byC[c].count++;byC[c].bruto+=d.amount||0;byC[c].w+=(d.amount||0)*getProb(d);
    const sl=(d.stage_label||"").toLowerCase();
    const stage=["prosp","calific","demo","reuni"].some(k=>sl.includes(k))?"Preventa":sl.includes("propuesta")?"Propuesta":sl.includes("negoc")?"Negociación":"Cierre/Contrato";
    if(!byC[c].stages[stage])byC[c].stages[stage]={count:0,w:0};
    byC[c].stages[stage].count++;byC[c].stages[stage].w+=(d.amount||0)*getProb(d);
  });
  const ctries=Object.entries(byC).filter(([c])=>FM[c]).sort((a,b)=>b[1].w-a[1].w);
  const maxW=Math.max(...ctries.map(([,v])=>v.w),1);
  const SC={"Preventa":"#64748b","Propuesta":"#3b82f6","Negociación":"#f97316","Cierre/Contrato":"#a855f7"};

  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <Label color={DS.text2}>Distribución de pipeline ponderado por país y etapa</Label>
      {ctries.map(([c,data])=>{
        const m=FM[c];
        const stages=Object.entries(data.stages).sort((a,b)=>b[1].w-a[1].w);

        return(
          <div key={c} style={{borderRadius:16,border:`1px solid ${DS.border}`,overflow:"hidden"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:`linear-gradient(135deg,${m.color}12,${m.color}06)`}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:24}}>{m.flag}</span>
                <div>
                  <span style={{fontSize:14,fontWeight:700,color:DS.text1,fontFamily:"monospace"}}>{c}</span>
                  <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace",marginLeft:8}}>{data.count} deals</span>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:15,fontWeight:900,color:m.color,fontFamily:"monospace"}}>{fmt(data.w)}</div>
                <div style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{fmt(data.bruto)} bruto</div>
              </div>
            </div>
            <div style={{padding:"12px 16px"}}>
              <div style={{display:"flex",height:16,borderRadius:8,overflow:"hidden",gap:1,marginBottom:10}}>
                {stages.map(([stage,{w}],i)=>(
                  <div key={i} style={{height:"100%",width:`${(w/totalSW)*100}%`,background:SC[stage]||"#52525b",transition:"width 0.7s"}} title={`${stage}: ${fmt(w)}`}/>
                ))}
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6}}>
                {stages.map(([stage,{count,w}],i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
                    <div style={{width:8,height:8,borderRadius:"50%",background:SC[stage]||"#52525b",flexShrink:0}}/>
                    <div>
                      <div style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{stage}</div>
                      <div style={{fontSize:10,color:DS.text1,fontFamily:"monospace",fontWeight:700}}>{fmt(w)} <span style={{color:DS.text3,fontWeight:400}}>({count})</span></div>
                    </div>
                  </div>
                ))}
              </div>
              <div style={{marginTop:8}}><MiniBar pct={(data.w/maxW)*100} color={m.color} height={4}/></div>

          </div>
        );
      })}

  );
}

function SecDeals({deals}){
  const [sub,setSub]=useState("top");
  const [fOwner,setFOwner]=useState("");
  const [fCountry,setFCountry]=useState("");
  const today=new Date().toISOString().split("T")[0];
  const wkS=wk(), moS=mo(), pS=prevMoStart(), pE=prevMoEnd();
  const zombieCut=new Date(Date.now()-ZOMBIE_DAYS*86400000).toISOString().split("T")[0];

  // Normalize for robust comparison
  const norm=s=>(s||"").toLowerCase().trim();
  const matchF=d=>{
    const om=!fOwner  || norm(d.owner)===norm(fOwner);
    const cm=!fCountry|| norm(d.country)===norm(fCountry);
    return om&&cm;
  };

  // Filter options from ALL deals
  const allOwners=[...new Set(deals.map(d=>d.owner).filter(Boolean))].sort();
  const allCountries=[...new Set([
    ...deals.map(d=>d.country).filter(Boolean),
    ...Object.keys(FM).filter(c=>deals.some(d=>norm(d.country)===norm(c)))
  ])].filter(Boolean).sort();

  const active=deals.filter(isActiveDeal);
  // All filtered sets — apply fOwner + fCountry
  const dealsF=deals.filter(matchF);
  const activeF=active.filter(matchF);
  const top10=[...activeF].sort((a,b)=>(b.amount||0)*getProb(b)-(a.amount||0)*getProb(a)).slice(0,15);
  const newWk=dealsF.filter(d=>!isLostDeal(d)&&d.created&&d.created>=wkS).sort((a,b)=>(b.amount||0)-(a.amount||0));
  const movedWk=activeF.filter(d=>d.last_activity&&d.last_activity>=wkS).sort((a,b)=>(b.amount||0)-(a.amount||0));
  const wonWk=dealsF.filter(d=>isWonDeal(d)&&wonDate(d)&&wonDate(d)>=wkS&&wonDate(d)>=YEAR_START);
  const wonMo=dealsF.filter(d=>isWonDeal(d)&&wonDate(d)&&wonDate(d)>=moS);
  const wonPrev=dealsF.filter(d=>isWonDeal(d)&&wonDate(d)>=pS&&wonDate(d)<=pE);
  const overdue=activeF.filter(d=>d.close_date&&d.close_date<today).sort((a,b)=>ago(a.close_date)-ago(b.close_date));
  const zombies=activeF.filter(d=>!d.last_activity||d.last_activity<zombieCut);

  const SUBS=[
    {id:"top",   label:"⭐ Top"},
    {id:"paises",label:"🌎 Por País"},
    {id:"new",   label:`🆕 Nuevos (${newWk.length})`},
    {id:"moved", label:`🔄 Movidos (${movedWk.length})`},
    {id:"won",   label:"🏆 Ganados"},
    {id:"alerts",label:`🚨 Alertas (${overdue.length+zombies.length})`},
  ];

  // Sprint 3: Deal score (0-100) — composite risk/opportunity indicator
  function dealScore(d){
    const today2=new Date().toISOString().split("T")[0];
    let score=50;
    const prob=getProb(d);
    score+=Math.round((prob-0.5)*40); // prob contribution (-20 to +20)
    if(d.close_date&&d.close_date<today2) score-=25; // overdue penalty
    if(d.last_activity){
      const daysOld=Math.round((new Date(today2)-new Date(d.last_activity))/86400000);
      if(daysOld>30) score-=20; else if(daysOld>14) score-=10; else score+=5;
    } else { score-=15; }
    const amt=d.amount||0;
    if(amt>500000) score+=10; else if(amt>100000) score+=5;
    return Math.max(0,Math.min(100,score));
  }
  function ScoreBadge({score}){
    const c=score>=70?DS.emerald:score>=45?DS.amber:DS.red;
    const label=score>=70?"🟢":score>=45?"🟡":"🔴";
    return <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,background:`${c}15`,color:c,border:`1px solid ${c}30`,fontFamily:"monospace",fontWeight:700}}>{label} {score}</span>;
  }

    // Deal score: composite risk/quality indicator (Sprint 3)
  function dealScore(d){
    const today2=new Date().toISOString().split("T")[0];
    const prob=getProb(d);
    const isOverdue=d.close_date&&d.close_date<today2;
    const daysSinceAct=d.last_activity?Math.round((Date.now()-new Date(d.last_activity))/86400000):999;
    const isZombie=daysSinceAct>ZOMBIE_DAYS;
    let s=Math.round(prob*60);
    if(!isOverdue&&d.close_date)s+=15;
    if(!isZombie)s+=Math.max(0,15-Math.floor(daysSinceAct/3));
    if((d.amount||0)>500000)s+=10;
    return Math.min(s,100);
  }
  function ScoreBadge({d}){
    const s=dealScore(d);
    const col=s>=70?DS.emerald:s>=45?DS.amber:DS.red;
    return <span style={{fontSize:8,padding:"1px 5px",borderRadius:10,background:`${col}15`,color:col,border:`1px solid ${col}30`,fontWeight:700,fontFamily:"monospace",flexShrink:0}}>Score:{s}</span>;
  }
  function DealItem({d,badge,bColor=DS.text3}){
    const score=dealScore(d);
    return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${DS.border}`}}>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:12,color:DS.text1,fontFamily:"monospace",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:4,flexWrap:"wrap"}}>
            <ScoreBadge d={d}/>
            <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{d.owner}</span>
            {d.country&&<span style={{fontSize:11}}>{FM[d.country]?.flag} {d.country}</span>}
            <PillBadge label={d.stage_label} color="#64748b"/>
            <PillBadge label={d.pipeline_id==="137007495"?"Últ.Milla":"Med.&1ra"} color={d.pipeline_id==="137007495"?"#3b82f6":"#f97316"}/>
            {d.close_date&&<span style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{"cierre: "+fmtD(d.close_date)}</span>}
          </div>
        </div>
        <div style={{textAlign:"right",marginLeft:12,flexShrink:0}}>
          <div style={{fontSize:12,fontFamily:"monospace",fontWeight:700,color:bColor}}>{badge}</div>
          <div style={{fontSize:11,color:DS.text1,fontFamily:"monospace",fontWeight:700}}>{fmt(d.amount)}</div>
          <div style={{fontSize:10,color:DS.cyan,fontFamily:"monospace"}}>{fmt((d.amount||0)*getProb(d))} pond.</div>
        </div>
      </div>
    );
  }

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      {/* Sub-tab navigation */}
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {SUBS.map(s=>(
          <button key={s.id} onClick={()=>setSub(s.id)} style={{padding:"6px 14px",fontSize:10,fontFamily:"monospace",borderRadius:8,cursor:"pointer",background:sub===s.id?"rgba(99,102,241,0.25)":"rgba(0,0,0,0.05)",color:sub===s.id?"#a5b4fc":DS.text3,border:`1px solid ${sub===s.id?"rgba(99,102,241,0.4)":DS.border}`,fontWeight:sub===s.id?700:400}}>{s.label}</button>
        ))}
      </div>

      {/* Cross-tab filters */}
      <div style={{display:"flex",flexDirection:"column",gap:8,padding:12,borderRadius:12,background:"rgba(0,0,0,0.02)",border:`1px solid ${DS.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:9,color:DS.text3,fontFamily:"monospace",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",width:60,flexShrink:0}}>Ejecutivo</span>
          {[""].concat(allOwners).map(o=>(
            <button key={o||"__all"} onClick={()=>setFOwner(o)}
              style={{padding:"3px 10px",fontSize:10,fontFamily:"monospace",borderRadius:20,cursor:"pointer",border:`1px solid ${fOwner===o?"rgba(99,102,241,0.5)":DS.border}`,background:fOwner===o?"rgba(99,102,241,0.25)":"transparent",color:fOwner===o?"#a5b4fc":DS.text3,whiteSpace:"nowrap"}}>
              {o||"Todos"}
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:9,color:DS.text3,fontFamily:"monospace",fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",width:60,flexShrink:0}}>País</span>
          {[""].concat(allCountries).map(c=>(
            <button key={c||"__all"} onClick={()=>setFCountry(c)}
              style={{padding:"3px 10px",fontSize:10,fontFamily:"monospace",borderRadius:20,cursor:"pointer",border:`1px solid ${fCountry===c?"rgba(0,212,170,0.5)":DS.border}`,background:fCountry===c?"rgba(0,212,170,0.2)":"transparent",color:fCountry===c?DS.emerald:DS.text3,whiteSpace:"nowrap"}}>
              {c?(FM[c]?.flag||"🌐")+" "+c:"Todos"}
            </button>
          ))}
        </div>
        {(fOwner||fCountry)&&(
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:9,color:DS.text3,fontFamily:"monospace"}}>
              Mostrando: {fOwner&&<b style={{color:"#a5b4fc"}}>{fOwner}</b>}{fOwner&&fCountry&&" · "}{fCountry&&<b style={{color:DS.emerald}}>{FM[fCountry]?.flag} {fCountry}</b>}
            </span>
            <button onClick={()=>{setFOwner("");setFCountry("");}} style={{fontSize:9,color:DS.text3,background:"none",border:`1px solid ${DS.border}`,borderRadius:6,padding:"2px 8px",cursor:"pointer",fontFamily:"monospace"}}>✕ Limpiar</button>
          </div>
        )}
      </div>


      {sub==="top"&&(
        <Card><Label color={DS.text2}>Top 10 por valor ponderado — 2026</Label><div style={{marginTop:12}}>
          {top10.map((d,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:`1px solid ${DS.border}`}}>
              <span style={{fontSize:13,fontWeight:900,color:DS.text3,fontFamily:"monospace",width:20,flexShrink:0}}>{i+1}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:DS.text1,fontFamily:"monospace",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
                <div style={{display:"flex",gap:8,marginTop:4,flexWrap:"wrap"}}>
                  <span style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{d.owner}</span>
                  {d.country&&<span style={{fontSize:11}}>{FM[d.country]?.flag} {d.country}</span>}
                  <PillBadge label={d.stage_label} color="#64748b"/>
                </div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                <div style={{fontSize:13,fontWeight:900,color:DS.text1,fontFamily:"monospace"}}>{fmt(d.amount)}</div>
                <div style={{fontSize:10,color:DS.cyan,fontFamily:"monospace"}}>{fmt((d.amount||0)*getProb(d))} pond.</div>
                <div style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{fmtD(d.close_date)}</div>
              </div>
            </div>
          ))}
        </div></Card>
      )}

      {sub==="paises"&&<FunnelByCountry deals={deals}/>}

      {sub==="new"&&(
        <Card><Label color={DS.text2}>Deals creados esta semana</Label><div style={{marginTop:12}}>
          {!newWk.length?<p style={{color:DS.text3,fontSize:11,fontFamily:"monospace",padding:"16px 0",textAlign:"center"}}>Sin nuevos deals esta semana</p>
            :newWk.map((d,i)=><DealItem key={i} d={d} badge={`creado ${fmtD(d.created)}`} bColor="#60a5fa"/>)}
        </div></Card>
      )}

      {sub==="moved"&&(
        <Card><Label color={DS.text2}>Deals con actividad esta semana</Label><div style={{marginTop:12}}>
          {!movedWk.length?<p style={{color:DS.text3,fontSize:11,fontFamily:"monospace",padding:"16px 0",textAlign:"center"}}>Sin movimientos esta semana</p>
            :movedWk.map((d,i)=><DealItem key={i} d={d} badge={`act. ${fmtD(d.last_activity)}`} bColor="#a78bfa"/>)}
        </div></Card>
      )}

      {sub==="won"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {[{label:"🏆 Ganados esta semana",data:wonWk,color:DS.emerald},{label:"🏆 Ganados este mes",data:wonMo,color:DS.emerald},{label:`📅 Ganados en ${PREV_MONTH_LABEL}`,data:wonPrev,color:"#818cf8"}].map(({label,data,color})=>(
            <Card key={label}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <Label color={color}>{label}</Label>
                <span style={{fontSize:16,fontWeight:900,color,fontFamily:"monospace"}}>{fmt(data.reduce((s,d)=>s+(d.amount||0),0))}</span>
              </div>
              {!data.length?<p style={{color:DS.text3,fontSize:11,fontFamily:"monospace"}}>Sin registros</p>
                :data.map((d,i)=><DealItem key={i} d={d} badge={fmt(d.amount)} bColor={color}/>)}
            </Card>
          ))}
        </div>
      )}

      {sub==="alerts"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {[{label:`🔴 Fechas vencidas (${overdue.length})`,data:overdue,color:DS.red,badge:d=>`+${ago(d.close_date)}d`},
            {label:`🧟 Zombies +${ZOMBIE_DAYS}d (${zombies.length})`,data:zombies,color:DS.amber,badge:d=>d.last_activity?`${ago(d.last_activity)}d`:"∞"}].map(({label,data,color,badge})=>(
            <Card key={label}>
              <Label color={color}>{label}</Label>
              <div style={{marginTop:12}}>
                {!data.length?<p style={{color:DS.text3,fontSize:11,fontFamily:"monospace"}}>Sin registros ✓</p>
                  :data.map((d,i)=><DealItem key={i} d={d} badge={badge(d)} bColor={color}/>)}
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════
// RANKINGS
// ══════════════════════════════════════════════════════════════════════════
function SecRankings({deals}){
  const [period,setPeriod]=useState("ytd");
  const active=deals.filter(isActiveDeal);
  const wkS=wk(), pS=prevMoStart(), pE=prevMoEnd(), moS=mo();
  const wonYtd=deals.filter(d=>isWonDeal(d)&&d.close_date>=YEAR_START);
  const wonPrevMo=deals.filter(d=>isWonDeal(d)&&wonDate(d)>=pS&&wonDate(d)<=pE);
  const wonMtd=deals.filter(d=>isWonDeal(d)&&wonDate(d)>=moS);

  const allOwners=[...new Set(deals.map(d=>d.owner).filter(Boolean))];
  const map={};
  allOwners.forEach(o=>{
    map[o]={owner:o,pipeW:0,pipeDeals:0,wonYtdVal:0,wonYtdDeals:0,wonPrevVal:0,wonPrevDeals:0,wonMtdVal:0,wonMtdDeals:0,
      propuestas:0,preventa:0,negoc:0,cierre:0,movWk:0,biggestDeal:null,countries:new Set()};
  });
  active.forEach(d=>{
    const m=map[d.owner||"?"]; if(!m)return;
    m.pipeW+=(d.amount||0)*getProb(d); m.pipeDeals++;
    const sl=(d.stage_label||"").toLowerCase();
    if(sl.includes("propuesta"))m.propuestas++;
    if(["preventa","calificac","explorac","prosp","demo"].some(k=>sl.includes(k)))m.preventa++;
    if(sl.includes("negoc"))m.negoc++;
    if(["contrato","setup","firma","cierre"].some(k=>sl.includes(k)))m.cierre++;
    if(d.last_activity>=wkS)m.movWk++;
    if(d.country)m.countries.add(d.country);
  });
  wonYtd.forEach(d=>{
    const m=map[d.owner||"?"]; if(!m)return;
    m.wonYtdVal+=d.amount||0; m.wonYtdDeals++;
    if(!m.biggestDeal||d.amount>m.biggestDeal.amount)m.biggestDeal=d;
    if(d.country)m.countries.add(d.country);
  });
  wonPrevMo.forEach(d=>{
    const m=map[d.owner||"?"]; if(!m)return;
    m.wonPrevVal+=d.amount||0; m.wonPrevDeals++;
    if(d.country)m.countries.add(d.country);
  });
  wonMtd.forEach(d=>{
    const m=map[d.owner||"?"]; if(!m)return;
    m.wonMtdVal+=d.amount||0; m.wonMtdDeals++;
    if(d.country)m.countries.add(d.country);
  });

  // Sprint 2: Budget Q1 per owner — use FM monthly totals month 0+1+2 weighted by owner count
  // Global Q1 budget = sum of all FM months 0+1+2
  const globalBudgetQ1=Object.values(FM).reduce((s,c)=>s+c.months[0]+c.months[1]+c.months[2],0);
  const tableVal=r=>period==="ytd"?r.wonYtdVal:period==="mtd"?r.wonMtdVal:r.wonPrevVal;
  const tableDeals=r=>period==="ytd"?r.wonYtdDeals:period==="mtd"?r.wonMtdDeals:r.wonPrevDeals;
  const rows=Object.values(map).sort((a,b)=>tableVal(b)-tableVal(a));
  if(!rows.length) return <p style={{color:DS.text3,textAlign:"center",padding:32,fontFamily:"monospace"}}>Sin datos</p>;

  const maxPipeW=Math.max(...rows.map(r=>r.pipeW),1);
  const maxTV=Math.max(...rows.map(r=>tableVal(r)),1);

  // Awards — switch based on period
  const isMtd=period==="mtd";
  const isYtd=period==="ytd";
  const wonKey=isYtd?"wonYtdVal":isMtd?"wonMtdVal":"wonPrevVal";
  const dealsKey=isYtd?"wonYtdDeals":isMtd?"wonMtdDeals":"wonPrevDeals";
  const periodLabel=isYtd?"YTD 2026":isMtd?"MTD Abril":PREV_MONTH_LABEL;

  const safeFrom=(arr,fn)=>{const a=arr.filter(Boolean);return a.length?a.reduce(fn):rows[0];};
  // -- YTD awards
  const topBigYtd = safeFrom(rows.filter(r=>r.biggestDeal),(a,b)=>(b.biggestDeal?.amount||0)>(a.biggestDeal?.amount||0)?b:a);
  const topDealsYtd = safeFrom(rows,(a,b)=>b.wonYtdDeals>a.wonYtdDeals?b:a);
  const topPropYtd = safeFrom(rows,(a,b)=>b.propuestas>a.propuestas?b:a);
  const topPipeYtd = safeFrom(rows,(a,b)=>b.pipeW>a.pipeW?b:a);
  const topWonYtd = safeFrom(rows,(a,b)=>b.wonYtdVal>a.wonYtdVal?b:a);
  const topPrevYtd = safeFrom(rows,(a,b)=>b.preventa>a.preventa?b:a);
  // -- Marzo / MTD awards
  const curWonKey=isMtd?"wonMtdVal":"wonPrevVal";
  const curWonDealsKey=isMtd?"wonMtdDeals":"wonPrevDeals";
  const curWinners = rows.filter(r=>r[curWonKey]>0);
  const topBigCur = safeFrom(curWinners,(a,b)=>b[curWonKey]>a[curWonKey]?b:a);
  const topDealsCur = safeFrom(curWinners,(a,b)=>b[curWonDealsKey]>a[curWonDealsKey]?b:a);
  const topCierreCur = safeFrom(rows,(a,b)=>b.cierre>a.cierre?b:a);
  const topPipeCur = safeFrom(rows,(a,b)=>b.pipeW>a.pipeW?b:a);
  const topWonCur = safeFrom(curWinners,(a,b)=>b[curWonKey]>a[curWonKey]?b:a);
  const topNegocCur = safeFrom(rows,(a,b)=>b.negoc>a.negoc?b:a);
  const febWinners = curWinners; // alias for detail section

  const AWARDS = isYtd ? [
    {icon:"💰",title:"Deal más caro YTD",winner:topBigYtd.owner,
     stat:topBigYtd.biggestDeal?fmt(topBigYtd.biggestDeal.amount):"—",
     sub:topBigYtd.biggestDeal?.name||""},
    {icon:"🎯",title:"Más deals ganados YTD",winner:topDealsYtd.owner,stat:`${topDealsYtd.wonYtdDeals} won`,sub:fmt(topDealsYtd.wonYtdVal)},
    {icon:"📋",title:"Más propuestas activas",winner:topPropYtd.owner,stat:`${topPropYtd.propuestas} prop.`,sub:`${topPropYtd.pipeDeals} deals activos`},
    {icon:"🚀",title:"Mayor pipeline ponderado",winner:topPipeYtd.owner,stat:fmt(topPipeYtd.pipeW),sub:`${topPipeYtd.pipeDeals} deals`},
    {icon:"🏆",title:"Mayor won YTD",winner:topWonYtd.owner,stat:fmt(topWonYtd.wonYtdVal),sub:`${topWonYtd.wonYtdDeals} deals`},
    {icon:"📢",title:"Más en preventa",winner:topPrevYtd.owner,stat:`${topPrevYtd.preventa}`,sub:"generando pipeline"},
  ] : [
    {icon:"🏆",title:`Mayor won ${periodLabel}`,winner:curWinners.length?topWonCur.owner:"Sin datos",stat:curWinners.length?fmt(topWonCur[curWonKey]):"—",sub:curWinners.length?`${topWonCur[curWonDealsKey]} deals`:""},
    {icon:"🎯",title:`Más deals ${periodLabel}`,winner:curWinners.length?topDealsCur.owner:"Sin datos",stat:curWinners.length?`${topDealsCur[curWonDealsKey]} won`:"—",sub:curWinners.length?fmt(topDealsCur[curWonKey]):""},
    {icon:"💰",title:`Deal más caro ${periodLabel}`,winner:curWinners.length?topBigCur.owner:"Sin datos",stat:curWinners.length?fmt(topBigCur[curWonKey]):"—",sub:""},
    {icon:"🚀",title:"Mayor pipeline activo",winner:topPipeCur.owner,stat:fmt(topPipeCur.pipeW),sub:`${topPipeCur.pipeDeals} deals`},
    {icon:"📝",title:"Más en cierre/contrato",winner:topCierreCur.cierre>0?topCierreCur.owner:"Sin datos",stat:topCierreCur.cierre>0?`${topCierreCur.cierre} deals`:"—",sub:"etapa contrato/setup"},
    {icon:"🤝",title:"Más en negociación",winner:topNegocCur.negoc>0?topNegocCur.owner:"Sin datos",stat:topNegocCur.negoc>0?`${topNegocCur.negoc} deals`:"—",sub:"cerrando actualmente"},
  ];

  return(
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",gap:8}}>
        {[["ytd","📆 2026 YTD"],["mtd","📅 MTD Abril"],["febrero","📅 "+PREV_MONTH_LABEL]].map(([p,l])=>(
          <button key={p} onClick={()=>setPeriod(p)} style={{padding:"6px 14px",fontSize:11,fontFamily:"monospace",borderRadius:8,cursor:"pointer",background:period===p?"rgba(244,63,94,0.2)":"rgba(0,0,0,0.05)",color:period===p?"#fb7185":DS.text3,border:`1px solid ${period===p?"rgba(244,63,94,0.35)":DS.border}`}}>{l}</button>
        ))}
      </div>

      {/* Awards grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        {AWARDS.map((a,i)=>(
          <Card key={i}>
            <div style={{fontSize:24,marginBottom:8}}>{a.icon}</div>
            <Label color={DS.text3}>{a.title}</Label>
            <div style={{fontSize:13,fontWeight:700,color:DS.text1,fontFamily:"monospace",marginTop:4}}>{a.winner}</div>
            <div style={{fontSize:18,fontWeight:900,color:DS.amber,fontFamily:"monospace",marginTop:2}}>{a.stat}</div>
            {a.sub&&<div style={{fontSize:10,color:DS.text3,fontFamily:"monospace",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.sub}</div>}
          </Card>
        ))}
      </div>

      {/* Won detail — Marzo o MTD */}
      {(period==="febrero"||period==="mtd")&&febWinners.length>0&&(
        <div style={{borderRadius:16,padding:20,background:"linear-gradient(135deg,rgba(99,102,241,0.1),rgba(99,102,241,0.04))",border:"1px solid rgba(99,102,241,0.2)"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}>
            <Label color="#818cf8">Won {periodLabel} — detalle completo</Label>
            <span style={{fontSize:16,fontWeight:900,color:"#818cf8",fontFamily:"monospace"}}>{fmt((period==="mtd"?wonMtd:wonPrevMo).reduce((s,d)=>s+(d.amount||0),0))}</span>
          </div>
          {(period==="mtd"?wonMtd:wonPrevMo).sort((a,b)=>(b.amount||0)-(a.amount||0)).map((d,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:"1px solid rgba(99,102,241,0.15)"}}>
              <span style={{fontSize:16}}>{FM[d.country]?.flag||"🌐"}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11,color:DS.text1,fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</div>
                <div style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{d.owner} · {fmtD(d.close_date)}</div>
              </div>
              <span style={{fontSize:12,color:"#818cf8",fontFamily:"monospace",fontWeight:900,flexShrink:0}}>{fmt(d.amount)}</span>
            </div>
          ))}
        </div>
      )}

      {/* Ranking table */}
      <Card>
        <Label color={DS.text2}>Tabla completa — ordenada por {period==="ytd"?"won YTD":"won "+PREV_MONTH_LABEL}</Label>
        <div style={{overflowX:"auto",marginTop:12}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{borderBottom:`1px solid ${DS.border}`}}>
                {["#","Ejecutivo","Pipeline Pond.",period==="ytd"?"Won YTD":"Won "+PREV_MONTH_LABEL,"Gap Q1 vs Budget","Propuestas","Preventa","Cierre","Movidos sem."].map(h=>(
                  <th key={h} style={{fontSize:9,color:DS.text3,textTransform:"uppercase",letterSpacing:"0.08em",padding:"0 10px 12px",fontFamily:"monospace",fontWeight:600,textAlign:h==="#"||h==="Ejecutivo"?"left":"right",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r,i)=>{
                const tv=tableVal(r);
                return(
                  <tr key={i} style={{borderBottom:`1px solid ${DS.border}`,background:r.wonYtdVal===0&&r.pipeW>200000?"rgba(245,158,11,0.03)":"transparent"}}>
                    <td style={{padding:"12px 10px",fontFamily:"monospace",fontSize:13,fontWeight:700,color:DS.text3}}>{i+1}</td>
                    <td style={{padding:"12px 10px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <div style={{fontSize:12,fontWeight:700,color:DS.text1,fontFamily:"monospace",whiteSpace:"nowrap"}}>{r.owner}</div>
                        {r.wonYtdVal===0&&r.pipeW>200000&&<PillBadge label="⚠️ $0 won" color={DS.amber}/>}
                      </div>
                      <div style={{fontSize:10,color:DS.text3,fontFamily:"monospace"}}>{[...r.countries].map(c=>FM[c]?.flag||"").join(" ")}</div>
                    </td>
                    <td style={{padding:"12px 10px",textAlign:"right"}}>
                      <div style={{fontSize:12,color:DS.cyan,fontFamily:"monospace",fontWeight:700}}>{fmt(r.pipeW)}</div>
                      <MiniBar pct={(r.pipeW/maxPipeW)*100} color="linear-gradient(90deg,#0891b2,#22d3ee)" height={3}/>
                    </td>
                    <td style={{padding:"12px 10px",textAlign:"right"}}>
                      <div style={{fontSize:12,color:tv>0?DS.emerald:DS.text3,fontFamily:"monospace",fontWeight:700}}>{tv>0?fmt(tv):"—"}</div>
                      <MiniBar pct={(tv/maxTV)*100} color={DS.emerald} height={3}/>
                    </td>
                    <td style={{padding:"12px 10px",textAlign:"right"}}>
                      {(()=>{
                        // Budget Q1 per owner = global Q1 budget / active owners count (rough proxy)
                        const activeOwners=Math.max(rows.filter(x=>x.pipeW>0||x.wonYtdVal>0).length,1);
                        const ownerBudgetQ1=globalBudgetQ1/activeOwners;
                        const gap=r.wonYtdVal-ownerBudgetQ1;
                        const pct=Math.round(r.wonYtdVal/Math.max(ownerBudgetQ1,1)*100);
                        const isZeroWon=r.wonYtdVal===0&&r.pipeW>200000;
                        return(
                          <div>
                            <span style={{fontSize:11,fontFamily:"monospace",fontWeight:700,color:isZeroWon?DS.amber:gap>=0?DS.emerald:DS.red}}>
                              {isZeroWon?"⚠️ —":gap>=0?"▲ +"+fmt(gap):"▼ "+fmt(Math.abs(gap))}
                            </span>
                            <div style={{fontSize:9,color:DS.text3,fontFamily:"monospace"}}>{pct}% del Q1</div>
                          </div>
                        );
                      })()}
                    </td>
                    <td style={{padding:"12px 10px",textAlign:"right",fontFamily:"monospace",fontSize:11,color:DS.text2}}>{r.propuestas||"—"}</td>
                    <td style={{padding:"12px 10px",textAlign:"right",fontFamily:"monospace",fontSize:11,color:DS.text3}}>{r.preventa||"—"}</td>
                    <td style={{padding:"12px 10px",textAlign:"right"}}><span style={{fontSize:11,fontFamily:"monospace",fontWeight:700,color:r.cierre>0?DS.amber:DS.text3}}>{r.cierre||"—"}</span></td>
                    <td style={{padding:"12px 10px",textAlign:"right",fontFamily:"monospace",fontSize:11,color:"#a78bfa"}}>{r.movWk||"—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}
